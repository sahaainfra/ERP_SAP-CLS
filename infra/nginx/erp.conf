# Part 30.08: the reverse proxy of one environment. The active slot is the one line of active-upstream.conf ("server <host>:<port>;"),
# rewritten by the blue-green deploy and the rollback before `nginx -s reload` (a reload finishes in-flight requests on the old workers).
upstream erp_active {
  include /etc/nginx/active-upstream.conf;
  keepalive 32;
}
server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate /etc/letsencrypt/live/erp/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/erp/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 30m;
  proxy_read_timeout 120s;
  location /socket.io/ {
    proxy_pass http://erp_active;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
  location / {
    proxy_pass http://erp_active;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_next_upstream error timeout http_502;
  }
}
