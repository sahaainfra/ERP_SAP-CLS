# Part 30.08 FR-03 FR-05: severity page goes to the on-call engineer (L2) at once, by phone and SMS through the paging provider, and to the
# ERP's own operations alerts (01.07, webhook); severity ticket opens a ticket for L2 in office hours. Receivers' secrets are in the vault.
route:
  receiver: l2-tickets
  group_by: [alertname]
  group_wait: 30s
  repeat_interval: 4h
  routes:
    - matchers: [ 'severity="page"' ]
      receiver: on-call
      repeat_interval: 30m
receivers:
  - name: on-call
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/paging-webhook-url
      - url: http://erp-active/api/v1/admin/ops/alerts/inbound
        http_config: { authorization: { credentials_file: /etc/alertmanager/secrets/erp-alert-token } }
  - name: l2-tickets
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/ticket-webhook-url
