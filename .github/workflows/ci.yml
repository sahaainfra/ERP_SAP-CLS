name: CI

# Runs on every pull request and on every push to main. Branch protection (docs/erp/RELEASE.md) makes the
# jobs "verify" and "security" required checks (add "codeql" once code scanning is enabled), so a pull request cannot merge unless they pass.
on:
  pull_request:
    # "labeled" so that adding the full-ci label to a pull request starts the full run straight away
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions minutes: the repository is private, so every runner minute is billed against the plan. A pull request runs the quick
# gates (unit, client, security, dependency-review) and verify. The long jobs (E2E shards, clock, dast, perf-smoke, container-scan,
# deploy-rehearsal, codeql) run on every push to main, on a manual run, and on a pull request that carries the label "full-ci".

jobs:
  # Audit AUD-DEF-020: the whole regression (about 35 minutes of unit tests with coverage, then hours of E2E) cannot finish inside one
  # 20-minute job, so it runs as four jobs with timeouts that fit them; "verify" is the gate that needs all of them (the required check).
  unit:
    name: unit, API and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      COVERAGE_MIN: '60'
      COVERAGE_BASE: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # lint, type check, unit/API/permission tests with coverage, coverage gate for changed files, migration up/down check, schema
      # lint and diff, tokens, icons, navigation, routes, permissions, defects, integrity suite, golden outputs, secret scan
      - run: npm run erp:regression -- --skip-e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-unit
          path: reports/regression
          if-no-files-found: ignore

  client:
    name: client build, installable app and bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run erp:regression -- --only build,pwa-check,bundle-budget

  e2e:
    name: E2E shard ${{ matrix.shard }} of 8
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # desktop and mobile viewports; Chrome is preinstalled on the runner. Each shard starts its own throw-away databases.
      - run: npx playwright test --shard=${{ matrix.shard }}/8 --trace off
      # audit step 0.2: the cross-company probe on what the shard's tests left in the database
      - run: npm run erp:scope-probe
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            reports/scope-probe.json
            playwright-report
            test-results
          if-no-files-found: ignore

  verify:
    name: verify
    runs-on: ubuntu-latest
    if: always()
    needs: [unit, client, e2e]
    timeout-minutes: 5
    steps:
      # E2E may be "skipped" only on a pull request without the full-ci label; on main, a manual run or a full-ci pull request it must pass.
      - name: every part of the regression passed
        env:
          E2E_REQUIRED: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          echo "unit: ${{ needs.unit.result }}, client: ${{ needs.client.result }}, e2e: ${{ needs.e2e.result }} (required: $E2E_REQUIRED)"
          test "${{ needs.unit.result }}" = success && test "${{ needs.client.result }}" = success
          if [ "$E2E_REQUIRED" = true ]; then test "${{ needs.e2e.result }}" = success; else test "${{ needs.e2e.result }}" = success -o "${{ needs.e2e.result }}" = skipped; fi

  clock:
    name: unit suite on a Sunday and on the last day of the year (part 166.1 F-09)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # ERP_TEST_NOW fixes the clock of the business date (src/shared/dates.js); 06:00 UTC is 11:30 in India
        now: ['2026-11-15T06:00:00Z', '2027-03-31T06:00:00Z']
    env:
      ERP_TEST_NOW: ${{ matrix.now }}
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Critical and High vulnerabilities block (BR-03). A time-boxed exception is recorded in
      # docs/erp/DECISIONS.md and the audit is re-run with an explicit override by an administrator.
      - run: npm run erp:audit
      - run: npm run erp:secret-scan

  # Part 30.05 FR-02: the dynamic scan of the application started on the runner (headers, CORS, error leakage, injection payloads on
  # every guarded list, traversal, signed-out access). A Critical or High finding fails the job.
  dast:
    name: dast
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/dast_scan.mjs --out reports/dast.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: reports/dast.json
          if-no-files-found: ignore

  # Part 30.06 FR-02: the performance smoke on every change (the load models at small scale against the real server, judged against the
  # SLOs by the report); the full load and the soak run by hand for now (.github/workflows/perf.yml).
  perf-smoke:
    name: perf-smoke
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/load_test.mjs --profile smoke --environment ci
      - run: node scripts/perf_verdict.mjs reports/load-smoke.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke
          path: reports/load-smoke.json
          if-no-files-found: ignore

  # A pull request that adds or raises a dependency with a known vulnerability, or a licence we cannot ship, is refused (part 02.07, FR-06).
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Container image scan (part 30.08 added the Dockerfile, closing D-110): build the image, check the compose file, scan with Trivy.
  container-scan:
    name: container-scan
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and scan the image
        run: |
          docker build -t erp:scan .
          AUTH_SECRET=ci-placeholder-secret-0123456789abcdef VAULT_KEY=ci-placeholder docker compose config --quiet
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0 image --severity HIGH,CRITICAL --exit-code 1 erp:scan

  # Part 30.08: environment parity (every environment defined by code, same keys, no secrets) and the zero-downtime blue-green deploy
  # and rollback rehearsal under traffic, with its two failure drills. Production changes go only through this pipeline (BR-01).
  deploy-rehearsal:
    name: deploy-rehearsal
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/env_parity.mjs
      - run: node scripts/rehearse_zero_downtime.mjs

  # Not blocking until code scanning is enabled in the repository settings (defect D-012); the job then
  # fails at upload with "Code scanning is not enabled". Remove continue-on-error once it is enabled.
  codeql:
    name: codeql
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  package:
    name: package
    needs: [verify, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
        env:
          BUILD_ID: ${{ github.run_number }}-${{ github.sha }}
          GIT_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_number }}
          path: artifacts/

  # Rehearses deploy, smoke test, rollback and the automatic-rollback drills on the runner itself, using
  # artefacts packaged from this commit. No hosting target is chosen yet (defect D-009), so this does not
  # touch a real server and production promotion is not wired.
  staging-rehearsal:
    name: staging-rehearsal
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.run_number }}
          path: artifacts/
      - run: npm run rehearse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-report
          path: reports/rehearsal.json
          if-no-files-found: ignore
