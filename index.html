<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1C2530" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ERP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Feature Flags - ERP</title>
  </head>
  <body>
    <!-- Part 166.4 (D-683): a shell drawn by the HTML itself, before any script, so a phone on a slow network shows the frame of the
         application at once instead of a blank page; React replaces it when the application starts. -->
    <style>
      .boot-shell { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1C2530; background: #F4F6F8; min-height: 100vh; }
      .boot-shell__bar { height: 56px; background: #1C2530; color: #fff; display: flex; align-items: center; padding: 0 16px; font-weight: 600; font-size: 18px; }
      .boot-shell__body { padding: 24px 16px; }
      .boot-shell__line { height: 14px; border-radius: 4px; background: #E3E8EE; margin: 12px 0; max-width: 520px; }
      @media (prefers-color-scheme: dark) { .boot-shell { background: #11161C; color: #E6EAF0; } .boot-shell__line { background: #232B35; } }
    </style>
    <div id="root"><div class="boot-shell" data-boot-shell role="status" aria-live="polite"><div class="boot-shell__bar">ERP</div><div class="boot-shell__body"><p>Opening your workspace…</p><div class="boot-shell__line"></div><div class="boot-shell__line" style="max-width:360px"></div><div class="boot-shell__line" style="max-width:440px"></div></div></div></div>
    <script src="/boot-guard.js"></script>
    <script type="module" src="/src/client/main.jsx"></script>
  </body>
</html>
