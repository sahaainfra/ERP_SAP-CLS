# Part 30.08 FR-01 FR-02: one host of an environment. Two application slots (blue and green) from the same image, behind nginx, which sends
# every request to the active slot (infra/nginx/active-upstream.conf, rewritten by the deploy before `nginx -s reload`). A deploy pulls the new
# image into the idle slot, migrates, smoke-tests it, switches nginx and keeps the old slot for an instant rollback (scripts/lib/bluegreen.mjs,
# runbook docs/erp/runbooks/deploy.md). Secrets come from the environment of the host (the vault, never this file).
#   ERP_ENV=staging ERP_IMAGE=erp:abc1234 docker compose --env-file infra/environments/staging.env up -d
name: erp-${ERP_ENV:-dev}
x-app: &app
  image: ${ERP_IMAGE:-erp:local}
  restart: unless-stopped
  env_file: [ "infra/environments/${ERP_ENV:-dev}.env" ]
  volumes: [ "erp-data:/data" ]
  logging: { driver: json-file, options: { max-size: "50m", max-file: "10" } }
  deploy: { resources: { limits: { memory: 1g } } }
services:
  blue:
    <<: *app
    environment: { PORT: "3301", AUTH_SECRET: "${AUTH_SECRET:?the vault provides AUTH_SECRET}", VAULT_KEY: "${VAULT_KEY}", FILE_URL_SECRET: "${FILE_URL_SECRET}", HEALTH_TOKEN: "${HEALTH_TOKEN}", BACKUP_KEY: "${BACKUP_KEY:-}" }
    expose: [ "3301" ]
  green:
    <<: *app
    environment: { PORT: "3302", AUTH_SECRET: "${AUTH_SECRET:?the vault provides AUTH_SECRET}", VAULT_KEY: "${VAULT_KEY}", FILE_URL_SECRET: "${FILE_URL_SECRET}", HEALTH_TOKEN: "${HEALTH_TOKEN}", BACKUP_KEY: "${BACKUP_KEY:-}" }
    expose: [ "3302" ]
    profiles: [ "deploy" ]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    volumes:
      - ./infra/nginx/erp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/active-upstream.conf:/etc/nginx/active-upstream.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [ blue ]
volumes:
  erp-data: {}
