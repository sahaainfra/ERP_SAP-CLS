      responses: { '200': { description: '{ data: { settings, history, openRequest } }' } }
  /api/v1/iam/admin/policy/change-requests:
    post:
      summary: Ask to change the policy; the other administrator approves (iam.security.manage; Idempotency-Key required)
      responses: { '201': { description: change request }, '409': { description: a request is already open }, '422': { description: nothing would change } }
  /api/v1/iam/admin/sessions:
    get:
      summary: Active sessions of the company (iam.security.view)
      responses: { '200': { description: '{ data, meta }' } }
  /api/v1/iam/admin/sessions/{id}/revoke:
    post:
      summary: Force a sign-out of one session with a reason (iam.security.manage; Idempotency-Key required)
      responses: { '200': { description: '{ data: { ended } }' } }
  /api/v1/iam/admin/users:
    get:
      summary: Users with second-step, lock and session state (iam.security.view)
      responses: { '200': { description: '{ data, meta }' } }
  /api/v1/iam/admin/users/{username}/sign-out:
    post:
      summary: Sign a person out everywhere (iam.security.manage; Idempotency-Key required)
      responses: { '200': { description: '{ data: { ended } }' } }
  /api/v1/iam/admin/users/{username}/unlock:
    post:
      summary: Clear a lockout (iam.security.manage; Idempotency-Key required)
      responses: { '200': { description: '{ data: { unlocked } }' } }
  /api/v1/iam/admin/login-events:
    get:
      summary: Login history; filters user, result, from, to, q (iam.security.view)
      responses: { '200': { description: '{ data, meta }' } }
  /api/v1/iam/org/context:
    get:
      summary: The company, projects and sites the signed-in person may work in (any signed-in user)
      responses: { '200': { description: '{ data: { companies, projects, sites } }' } }
  /api/v1/iam/org/tree:
    get:
      summary: The whole organisation of the company as nested trees (org.view)
      responses: { '200': { description: '{ data: { company, branches, departments, projects, locations, costCentres } }' } }
  /api/v1/iam/org/lookups/users:
    get:
      summary: Active users of the company to pick as head, manager or in-charge (org.view)
      responses: { '200': { description: '{ data: [{ id, username, displayName }] }' } }
  /api/v1/iam/org/geofence/test:
    post:
      summary: Test a coordinate against an unsaved geofence shape (org.view)
      responses: { '200': { description: '{ data: { method, inside, strictlyInside, edgeDistanceM, toleranceM } }' } }
  /api/v1/iam/org/{entity}:
    get:
      summary: List companies, branches, departments, designations, projects, sites, locations or cost-centres; q, sort, page, pageSize, filter[...] (org.view)
      responses: { '200': { description: '{ data, meta }' } }
    post:
      summary: Create one (the entity's manage permission; Idempotency-Key required). Projects and sites start as drafts
      responses: { '201': { description: '{ data }' }, '409': { description: 'code already used under the same parent' } }
  /api/v1/iam/org/{entity}/{id}:
    get:
