      summary: Stages, enforcements, modes and roles for the forms
      responses: { '200': { description: '{ data }' } }
  /api/v1/pcs/control-points/{code}:
    get:
      summary: One control point with its observation figures, its changes and what it found lately
      responses: { '200': { description: '{ data }' } }
    put:
      summary: Change a control point (Idempotency-Key required). A control in or going to ENFORCE is changed through its approval chain (202) and goes to ENFORCE only after the days of observation set by eng.pcs.observe_days (422 before)
      responses: { '200': { description: '{ data }' } }
    delete:
      summary: Remove a control point written as data (it must be OFF)
      responses: { '200': { description: '{ data }' } }
  /api/v1/pcs/reason-codes:
    get:
      summary: The reason codes as the company sees them, for every action type (all=true includes switched-off ones)
      responses: { '200': { description: '{ data }' } }
    post:
      summary: Add a reason code for the company, or switch a shared one off for it
      responses: { '201': { description: '{ data }' } }
    put:
      summary: Change a reason code of the company (version for optimistic locking)
      responses: { '200': { description: '{ data }' } }
  /api/v1/pcs/exceptions:
    get:
      summary: The exceptions register: filters status, control, project, value, emergency, words; the raiser sees their own, a watcher those of their scope
      responses: { '200': { description: '{ data }' } }
    post:
      summary: Start an exception for an action a control stopped; the server finds the failed check and takes the value at risk from it
      responses: { '201': { description: '{ data }' } }
  /api/v1/pcs/exceptions/export:
    get:
      summary: Export the register as xlsx, csv or pdf with the filters and permissions of the list
      responses: { '200': { description: '{ data }' } }
  /api/v1/pcs/exceptions/{id}:
    get:
      summary: One exception with its evidence, the checks, and its approval
      responses: { '200': { description: '{ data }' } }
    put:
      summary: Change the reason or the justification of a draft or returned exception
      responses: { '200': { description: '{ data }' } }
  /api/v1/pcs/exceptions/{id}/submit:
    post:
      summary: Send an exception into approval (evidence required where the control or reason asks) (Idempotency-Key required)
      responses: { '201': { description: '{ data }' } }
  /api/v1/pcs/exceptions/{id}/cancel:
    post:
      summary: Cancel an exception that has not been used, with a reason (Idempotency-Key required)
      responses: { '200': { description: '{ data }' } }
  /api/v1/pcs/dashboard:
    get:
      summary: Tiles, trend, top failing controls, ageing, by control and by person, and the rollout of modes
      responses: { '200': { description: '{ data }' } }
  /api/v1/pcs/cycle/{entity}/{id}:
    get:
      summary: The stages of Plan, Verify, Approve, Execute, Record, Monitor, Reconcile and Close a business object has passed, with what the controls said
      responses: { '200': { description: '{ data }' } }
  /api/v1/eng/sample-docs/import:
    post:
      summary: Create and submit sample documents from rows; each row goes through the same control checks as the screen, and a row a control stops stays a draft (Idempotency-Key required)
      responses: { '201': { description: '{ data }' } }
  /api/v1/tpl/templates:
    get:
      summary: List the templates, the shared standard formats and the company's own versions (tpl.template.view); filters docType, status, q
      responses: { '200': { description: '{ data: { rows, total, docTypes, canEdit } }' } }
    post:
      summary: Make a draft template, a new code or the next version of a code; the HTML is checked against the variable catalogue of the document type (tpl.template.edit, Idempotency-Key required)
      responses: { '201': { description: the draft }, '409': { description: a draft of the code already exists }, '422': { description: a variable is not in the catalogue, or the HTML is outside the allowed subset } }
  /api/v1/tpl/templates/catalogue:
    get:
      summary: The variables, the groups and the standard format of a document type (query docType)
      responses: { '200': { description: '{ data }' } }
  /api/v1/tpl/templates/validate:
    post:
      summary: Check a template without saving it; returns every problem with its line (body docType, html, css)
      responses: { '200': { description: '{ data: { ok, problems, warnings, variables } }' } }
  /api/v1/tpl/templates/preview:
    post:
      summary: Draw a template with the sample record or a real record as a PDF watermarked PREVIEW; nothing is stored (body templateId or docType and html; recordId)
      responses: { '200': { description: application/pdf }, '403': { description: no right to see templates, or to print the record } }
  /api/v1/tpl/templates/{id}:
    get:
      summary: One template with its HTML, style, letterhead and versions
      responses: { '200': { description: '{ data }' } }
    patch:
      summary: Change a draft (rowVersion for optimistic locking)
      responses: { '200': { description: the draft }, '409': { description: changed by someone else, or not a draft } }
    delete:
      summary: Discard a draft
      responses: { '200': { description: '{ data }' } }
  /api/v1/tpl/templates/{id}/submit:
    post:
      summary: Send the draft to the process owner of its document type for approval (maker-checker); the maker cannot approve it (Idempotency-Key required)
      responses: { '202': { description: in review, with the workflow instance } }
  /api/v1/tpl/records:
    get:
      summary: The approved records documents are made from (tpl.document.generate); pay and identity fields are masked without tpl.document.generate_sensitive
      responses: { '200': { description: '{ data: { rows } }' } }
    put:
      summary: A module hands over the approved data of a document; totals are recomputed and a different total sent is refused (tpl.record.publish, Idempotency-Key required)
      responses: { '200': { description: the record }, '409': { description: an official document exists and no reason was given }, '422': { description: the data does not pass the checks } }
  /api/v1/tpl/generate:
    post:
      summary: Generate an official document (PDF with a QR verification code) from approved data and the active template (body docType, entityId, templateCode, purpose, pdfa, reason; Idempotency-Key required). A new version of an existing document needs a reason.
      responses: { '201': { description: the generated document }, '403': { description: no right to generate here }, '409': { description: a document exists and no reason, or no approved template }, '422': { description: not approved data or a sample }}
  /api/v1/tpl/generate/bulk:
    post:
      summary: Generate up to 1000 documents as one background job; every record is checked with the caller's rights first and nothing starts if one is refused (Idempotency-Key required)
      responses: { '202': { description: the job, QUEUED } }
  /api/v1/tpl/generate/bulk/{id}:
    get:
      summary: Progress and result of a bulk generation
      responses: { '200': { description: '{ data: { status, total, done, failed, results } }' } }
  /api/v1/tpl/generated:
    get:
      summary: The generated documents the caller may see, with filters, the count by document type and the deliveries sent (tpl.document.view)
      responses: { '200': { description: '{ data: { rows, total, summary } }' } }
  /api/v1/tpl/generated/export:
    get:
      summary: The same list as xlsx, csv or pdf, honouring the filters and the caller's visibility
      responses: { '200': { description: file } }
  /api/v1/tpl/generated/{id}:
    get:
      summary: One generated document with its versions and its delivery log (a payslip is not said to exist to someone without the right)
      responses: { '200': { description: '{ data }' }, '404': { description: not found or not visible } }
  /api/v1/tpl/generated/{id}/content:
    get:
      summary: The PDF for a signed-in person; each opening is written to the audit trail and the delivery log (query download=1 to save)
      responses: { '200': { description: application/pdf } }
  /api/v1/tpl/generated/{id}/file:
    get:
      summary: The PDF for a signed link (exp, sig) sent in an e-mail or WhatsApp message; no sign-in, valid 7 days, the signature covers the expiry
      responses: { '200': { description: application/pdf }, '403': { description: link not valid }, '410': { description: link expired } }
  /api/v1/tpl/generated/{id}/deliver:
    post:
      summary: Deliver by EMAIL, WHATSAPP (through the communication gateway), MESSAGE or PORTAL (published as an event for the owning module); one delivery row for each recipient (tpl.document.deliver, Idempotency-Key required)
      responses: { '201': { description: '{ data: { deliveries } }' } }
  /api/v1/tpl/deliveries:
    get:
      summary: The delivery log (not the downloads)
      responses: { '200': { description: '{ data: { rows } }' } }
  /api/v1/tpl/rules:
    get:
      summary: The approval milestones that generate a document by themselves
      responses: { '200': { description: '{ data: { rows, workflowTypes } }' } }
    put:
      summary: Switch on or off the generation of a document when a workflow document type is approved (tpl.rule.edit)
      responses: { '200': { description: '{ data }' } }
  /api/v1/tpl/verify/{code}:
    get:
      summary: Public, no sign-in. What a QR code on a document says: genuine or not, the version, whether it is the current one (04.12 builds the verification page on this)
      responses: { '200': { description: '{ data: { valid, current, message, document } }' } }
  /api/v1/verify/{code}:
    get:
      summary: Public, no sign-in, rate limited. Whether the document is genuine, superseded (with the date), cancelled (with the date) or unknown, and the fields the company made public (type, number, issuer, version, date, signers, project, amount)
      responses: { '200': { description: '{ data: { found, valid, status, message, ... } }' } }
  /api/v1/verify/{code}/file:
    post:
      summary: Public. Compare the file sent as the request body with the stored hash of the document and its signed copies; a mismatch is a security event
      responses: { '200': { description: '{ data: { ..., file: { match, kind, fingerprint, message } } }' }, '400': { description: empty body } }
  /api/v1/sig/documents/{id}:
    get:
      summary: Full detail of the signatures of a generated document, its hash, the chain check, the copies and the checks made (sig.document.view)
      responses: { '200': { description: '{ data }' }, '404': { description: not found or not visible } }
  /api/v1/sig/documents/{id}/sign:
    post:
      summary: Sign a document (body method APPROVAL, IMAGE, ESIGN or DSC; sig.document.sign; Idempotency-Key required). ESIGN and DSC need a connected provider.
      responses: { '201': { description: the document with its signatures }, '409': { description: already signed, cancelled, superseded or no provider }, '422': { description: no signature picture } }
  /api/v1/sig/documents/{id}/cancel:
    post:
      summary: Cancel a document; verification then says so with the date (sig.document.cancel; reason required)
      responses: { '200': { description: '{ data }' }, '409': { description: already cancelled } }
  /api/v1/sig/documents/{id}/signed:
    get:
      summary: The signed copy (or the original when nobody signed) for a signed-in person who may see the document
      responses: { '200': { description: application/pdf } }
  /api/v1/sig/signatures/{id}/revoke:
    post:
      summary: Revoke a signature (sig.signature.revoke; reason required); the stamped copy is redrawn and verification shows it
      responses: { '200': { description: '{ data }' }, '409': { description: already revoked } }
  /api/v1/sig/verify/{code}:
    get:
      summary: Full detail by code for a signed-in person who may see the document
      responses: { '200': { description: '{ data }' }, '404': { description: unknown or not visible } }
  /api/v1/sig/register:
    get:
      summary: The signature register with filters, count by method and status, checks made (sig.register.view; limited to the caller's projects)
      responses: { '200': { description: '{ data: { rows, total, summary } }' } }
  /api/v1/sig/register/export:
    get:
      summary: The register as xlsx, csv or pdf
      responses: { '200': { description: file } }
  /api/v1/sig/profile:
    get:
      summary: The caller's own signature picture
      responses: { '200': { description: '{ data: { has, image } }' } }
    put:
      summary: Set the signature picture (PNG or JPEG data URL, at most 150 KB)
      responses: { '200': { description: '{ data }' }, '400': { description: not a usable picture } }
    delete:
      summary: Remove the signature picture
      responses: { '200': { description: '{ data }' } }
  /api/v1/sig/config:
    get:
      summary: The public fields, automatic signing and stamp placement in force, and a change that waits for approval (sig.config.view)
      responses: { '200': { description: '{ data }' } }
  /api/v1/sig/config/changes:
    post:
      summary: Propose a change of the signature settings; it takes effect when a director or another administrator approves (sig.config.edit; Idempotency-Key required)
      responses: { '202': { description: waiting for approval }, '409': { description: a change already waits } }
  /api/v1/xl/templates:
    get:
      summary: The imports the caller may open, with their columns, version and whether they may be exported (xl.import.use)
      responses: { '200': { description: '{ data: { types } }' } }
  /api/v1/xl/templates/{type}/download:
    get:
      summary: The template workbook of an import (protected header, instructions, drop-down lists, type and version); needs the import's own permission
      responses: { '200': { description: xlsx }, '403': { description: no right to this import } }
  /api/v1/xl/templates/{type}/export:
    get:
      summary: The data of an import type in the form of its template, with sensitive columns masked
      responses: { '200': { description: xlsx } }
  /api/v1/xl/designer:
    get:
      summary: Each import with its wording, required flags, settings, a change waiting for approval and the history of versions (xl.template.view)
      responses: { '200': { description: '{ data }' } }
  /api/v1/xl/designer/changes:
    post:
      summary: Propose a change of a template (labels, help, instructions, required, chunked commit); it takes effect when a second person approves (xl.template.edit; Idempotency-Key required)
      responses: { '202': { description: waiting for approval }, '409': { description: a change already waits } }
  /api/v1/xl/jobs:
    post:
      summary: Upload a filled template (the raw .xlsx as the body; query type, onExisting ERROR|UPDATE|SKIP, fileName; Idempotency-Key required). The file is scanned and a job checks it; nothing is saved.
      responses: { '202': { description: the job }, '400': { description: empty, too large or not .xlsx }, '403': { description: no right to this import }, '422': { description: refused by the virus scan } }
    get:
      summary: The history of import jobs (own; all with xl.job.view_all) with filters and the count by status
      responses: { '200': { description: '{ data: { rows, total, summary } }' } }
  /api/v1/xl/jobs/{id}:
    get:
      summary: One job with its status, counts, mode, progress, structure problems and result
      responses: { '200': { description: '{ data }' }, '404': { description: not found or not yours } }
  /api/v1/xl/jobs/{id}/preview:
    get:
      summary: A page of the rows as read, with what each will do (create, update, skip, error), sensitive columns masked
      responses: { '200': { description: '{ data: { columns, rows, total } }' } }
  /api/v1/xl/jobs/{id}/errors:
    get:
      summary: The row-level errors (sheet, row, column, value, reason); format=xlsx gives the error file to correct and upload again
      responses: { '200': { description: json or xlsx } }
  /api/v1/xl/jobs/{id}/commit:
    post:
      summary: Commit a checked job (skipInvalid to leave the rows with errors out, mode CHUNKED where the template allows it, version for optimistic locking; Idempotency-Key required). Runs as a background job; all or nothing.
      responses: { '202': { description: committing }, '409': { description: rows have errors, not in a committable state or changed }, '422': { description: nothing to import or chunked not enabled } }
  /api/v1/xl/jobs/{id}/cancel:
    post:
      summary: Cancel a job that is not committed; nothing was saved
      responses: { '200': { description: '{ data }' }, '409': { description: committing or committed } }
  /api/v1/xl/exports:
    get:
      summary: The lists the caller may export
      responses: { '200': { description: '{ data: { exports } }' } }
  /api/v1/xl/exports/{code}:
    get:
      summary: Export a registered list (xlsx, csv or pdf), limited to what the caller may see, sensitive columns masked, formulas made inert
      responses: { '200': { description: file }, '403': { description: no right }, '404': { description: unknown list } }
  /api/v1/col/comments:
    get:
      summary: The threaded discussion of a record (query entity, id) with reactions, files, who may edit or delete, the settings and the comments written before part 04.14 (read only)
      responses: { '200': { description: '{ data: { comments, legacy, total, settings, canModerate } }' }, '403': { description: no right to the record type }, '404': { description: the record does not exist for this person } }
    post:
      summary: Post a comment or a reply ({ entity, id, body, parentId? }; Idempotency-Key required). A mention of a person who cannot see the record refuses the comment
      responses: { '201': { description: '{ data: { id, mentions, ignored } }' }, '422': { description: a mentioned person cannot see the record, or the text is too long } }
  /api/v1/col/comments/{id}:
    patch:
      summary: Edit a comment inside the edit window (author only; version for optimistic locking)
      responses: { '200': { description: edited }, '403': { description: not the author }, '409': { description: changed meanwhile }, '422': { description: the window is over } }
    delete:
      summary: Delete a comment (author, or a moderator with a reason); the text stays in the audit trail
      responses: { '200': { description: deleted }, '403': { description: neither the author nor a moderator }, '422': { description: a reason is needed } }
  /api/v1/col/comments/{id}/reactions:
    post:
      summary: Add or take back a reaction ({ reaction like|ack|eyes|thanks, on })
      responses: { '200': { description: '{ data: { count, mine } }' }, '422': { description: reactions are switched off } }
  /api/v1/col/timeline:
    get:
      summary: The activity timeline of a record (query entity, id, kinds, from, to, q, limit, offset) merging audit, approvals, workflow, comments, documents, tasks and messages, newest first, with the count of each kind
      responses: { '200': { description: '{ data: { rows, total, counts, kinds } }' } }
  /api/v1/col/feed:
    get:
      summary: The project activity feed (query projectId, kinds, from, to, q, limit, offset); without projectId the projects the person may pick
      responses: { '200': { description: '{ data: { rows, total, counts, projects } }' }, '403': { description: no col.activity.view for that project } }
  /api/v1/col/trace:
    get:
      summary: What a record came from (upstream) and what came from it (downstream) to a depth of 1 to 8, with status and amount; records the person cannot open appear as restricted
      responses: { '200': { description: '{ data: { root, upstream, downstream, totals, truncated, canLink } }' } }
  /api/v1/col/trace/links:
    post:
      summary: Link two records by hand ({ from, to, relation, reason of 10 characters or more }); permission col.trace.link and access to both records
      responses: { '201': { description: linked }, '409': { description: already linked } }
  /api/v1/col/trace/links/{id}:
    delete:
      summary: Remove a link that was made by hand (a link made by the system cannot be removed)
      responses: { '200': { description: removed }, '422': { description: made by the system } }
  /api/v1/col/mentions:
    get:
      summary: The mentions inbox of the person (query unread, limit, offset), only for records they can still open
      responses: { '200': { description: '{ data: { rows, total, unread } }' } }
  /api/v1/col/mentions/read:
    post:
      summary: Mark mentions as read ({ ids } or { all: true })
      responses: { '200': { description: '{ data: { marked } }' } }
  /api/v1/off/devices:
    post:
      summary: Register this browser for offline work ({ deviceId, name, platform }); registering again is the same device; a revoked device is refused with wipe
      responses: { '201': { description: the device }, '403': { description: DEVICE_REVOKED with details[0].wipe } }
    get:
      summary: The person's devices; all of them with all=true and off.device.manage (query status, q, limit, offset)
      responses: { '200': { description: '{ data: { rows, total, counts, canManage } }' } }
  /api/v1/off/devices/{id}/revoke:
    post:
      summary: Revoke a device ({ reason }); the IT administrator any device, a person their own. Its next contact is told to wipe its local data
      responses: { '200': { description: the device }, '404': { description: not found or not yours }, '409': { description: already revoked } }
  /api/v1/off/devices/wiped:
    post:
      summary: The device confirms that its local data was removed
      responses: { '200': { description: the device with status WIPED } }
  /api/v1/off/masters:
    get:
      summary: The master data and the offline forms with their rules for this person (query since for a delta, codes); includes expiresAt after which the copy is not to be used
      responses: { '200': { description: '{ data: { serverTime, expiresAt, forms, masters, settings } }' }, '403': { description: DEVICE_REVOKED } }
  /api/v1/off/sync:
    post:
      summary: Send a batch of offline commands ({ deviceId, deviceTime, commands[{ id, seq, type, op, ref, entityId, values, baseVersion, baseValues, createdAt, gps }] }); the same id again returns the first answer; the result of each is APPLIED, REJECTED, DEFERRED, CONFLICT or NEEDS_CONFIRMATION; driftMs and a warning are returned
      responses: { '200': { description: '{ data: { serverTime, driftMs, driftWarning, results, counts } }' }, '403': { description: DEVICE_REVOKED }, '404': { description: DEVICE_UNKNOWN }, '422': { description: more than the batch limit } }
  /api/v1/off/commands:
    get:
      summary: The commands of the person and what became of them (query status, all with off.sync.view_all)
      responses: { '200': { description: '{ data: { rows, total, counts } }' } }
  /api/v1/off/commands/{id}:
    get:
      summary: One command with what the phone sent
      responses: { '200': { description: the command }, '404': { description: not found or not yours } }
  /api/v1/off/commands/{id}/resolve:
    post:
      summary: Resolve a conflict ({ choice MINE|SERVER|MERGE, fields { key: mine|server|typed value } })
      responses: { '200': { description: RESOLVED }, '409': { description: not in conflict }, '422': { description: a side is missing or the result fails validation } }
  /api/v1/off/confirmations:
    get:
      summary: Old offline commands waiting for a supervisor (permission off.sync.confirm, for the supervisor's projects)
      responses: { '200': { description: '{ data: { rows } }' } }
  /api/v1/off/commands/{id}/confirm:
    post:
      summary: Confirm or decline an old command ({ decision CONFIRM|DECLINE, reason }); not by its author
      responses: { '200': { description: APPLIED or DECLINED }, '403': { description: own command or no right for the project }, '409': { description: not waiting } }
  /api/v1/off/uploads:
    post:
      summary: Start (or resume) a photo upload for a command ({ deviceId, commandId, fileName, totalSize, chunkSize }); the answer lists the chunks already received
      responses: { '201': { description: the upload }, '404': { description: the command is not known to the server yet } }
  /api/v1/off/uploads/{id}:
    get:
      summary: The state of an upload (received chunks, status)
      responses: { '200': { description: the upload } }
  /api/v1/off/uploads/{id}/chunks/{index}:
    put:
      summary: One chunk of the file (raw bytes, at most 1 MB)
      responses: { '200': { description: the upload }, '422': { description: the chunk has the wrong size } }
  /api/v1/off/uploads/{id}/complete:
    post:
      summary: Assemble the file, check its type, size and for viruses, and attach it to the record the command made; completing twice is the same file
      responses: { '200': { description: the upload with fileId }, '409': { description: the record is not saved yet }, '422': { description: refused } }
  /api/v1/msg/conversations:
    get:
      summary: The person's conversations in one list, pinned first then by last activity, with unread counts and the last message (query view all|unread|pinned|archived|<type>, q, limit, offset); external threads of the communication gateway are included for those who may read the log
      responses: { '200': { description: '{ data: { rows, total, counts, canExternal, canManage } }' } }
    post:
      summary: Make a conversation ({ type DIRECT|GROUP|TEAM|PROJECT|SITE|DEPARTMENT|RECORD, title, members, projectId, siteId, departmentId, entity, entityId }); a direct, place or record conversation that exists is returned (200) instead of a second one (201)
      responses: { '201': { description: '{ data: { id, created } }' }, '403': { description: no right to make that channel }, '422': { description: a person is unknown or cannot see the record } }
  /api/v1/msg/conversations/{id}:
    get:
      summary: Details of a conversation: members, shared files, linked records (cards drawn for the reader) and the person's own settings
      responses: { '200': { description: the conversation }, '404': { description: not a member, or it does not exist } }
    patch:
      summary: Rename a group, team or channel (administrators)
      responses: { '200': { description: the conversation }, '403': { description: not an administrator } }
  /api/v1/msg/conversations/{id}/settings:
    put:
      summary: The person's own pin, mute (mutedUntil), mention-only and archive of this conversation
      responses: { '200': { description: the conversation } }
  /api/v1/msg/conversations/{id}/archive:
    post:
      summary: Archive or unarchive for everyone (administrators); nobody can write in an archived conversation
      responses: { '200': { description: the conversation } }
  /api/v1/msg/conversations/{id}/read:
    post:
      summary: Mark the conversation read up to a message (default the last)
