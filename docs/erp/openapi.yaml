      responses: { '201': { description: '{ data: { applied, effectiveFrom } }' } }
  /api/v1/iam/org/{entity}/{id}/history:
    get:
      summary: Effective-dated assignments and the audit trail
      responses: { '200': { description: '{ data: { assignments, audit } }' } }
  /api/v1/iam/org/{entity}/{id}/requests:
    get:
      summary: Approval requests raised for a project or site, with their steps
      responses: { '200': { description: '{ data: [request] }' } }
  /api/v1/iam/org/projects/{id}/status:
    post:
      summary: Put on hold, resume, complete or close a project (reason and version); a first activation is refused here
      responses: { '200': { description: '{ data }' } }
  /api/v1/iam/org/projects/{id}/activation-requests:
    post:
      summary: Ask for a draft project to be activated; chain PD then PCMGR (Idempotency-Key required)
      responses: { '201': { description: '{ data: request }' } }
  /api/v1/iam/org/sites/{id}/activation-requests:
    post:
      summary: Ask for a draft or inactive site to be activated; the project must be active; chain PD then PCMGR
      responses: { '201': { description: '{ data: request }' } }
  /api/v1/iam/org/sites/{id}/geofence/change-requests:
    post:
      summary: Ask to change the geofence of a site that is not a draft; reason mandatory; chain SYSADM (org.geofence.request)
      responses: { '201': { description: '{ data: request }' } }
  /api/v1/iam/org/sites/{id}/geofence/test:
    post:
      summary: Test a coordinate (latitude, longitude, toleranceM) against the site's geofence (org.view)
      responses: { '200': { description: '{ data: { method, inside, strictlyInside, edgeDistanceM, toleranceM } }' } }
  /api/v1/iam/users:
    get:
      summary: Users of your company: search, filter[status|type|departmentId|projectId|role], sort, 25/50/100 per page (iam.user.view; the mobile number is masked without iam.user.manage)
      responses: { '200': { description: '{ data: [user], meta }' } }
    post:
      summary: Create a user in the Invited state, optionally sending the invitation (iam.user.manage; Idempotency-Key required); 409 DUPLICATE_USER on a matching email, mobile, username or employee link
      responses: { '201': { description: '{ data }' } }
  /api/v1/iam/users/roles:
    get:
      summary: The role codes a role request may name, and which are privileged (iam.user.view)
      responses: { '200': { description: '{ data: [{ code, privileged }] }' } }
  /api/v1/iam/users/duplicates:
    get:
      summary: People who already use an email, mobile number or employee code (iam.user.view); used by the invite form while typing
      responses: { '200': { description: '{ data: [match] }' } }
  /api/v1/iam/users/import/template:
    get:
      summary: The CSV template for a bulk import (text/csv)
      responses: { '200': { description: 'text/csv' } }
  /api/v1/iam/users/import:
    post:
      summary: Check (mode=validate, writes nothing) or import (mode=commit, Idempotency-Key required) a CSV file sent as text/csv; row-level errors; skipInvalid=true imports only the valid rows; invite=true sends invitations (iam.user.manage)
