  /api/v1/iam/users/bulk:
    post:
      summary: Invite or suspend up to 200 selected users; each is reported separately (Idempotency-Key required)
      responses: { '200': { description: '{ data: { requested, succeeded, failed, results } }' } }
  /api/v1/iam/users/{id}:
    get:
      summary: One user with role history, approval requests, live sessions and organisation roles (iam.user.view)
      responses: { '200': { description: '{ data }' } }
    patch:
      summary: Change details (version required; email, mobile, language, type, employee code, department, home project) (iam.user.manage)
      responses: { '200': { description: '{ data }' } }
  /api/v1/iam/users/{id}/sessions:
    get:
      summary: Live sessions of the user (iam.user.view)
      responses: { '200': { description: '{ data }' } }
  /api/v1/iam/users/{id}/login-events:
    get:
      summary: Login history of the user, paged (iam.user.view)
      responses: { '200': { description: '{ data: [event], meta }' } }
  /api/v1/iam/users/{id}/timeline:
    get:
      summary: The audit trail of the user (iam.user.view)
