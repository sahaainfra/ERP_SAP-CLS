openapi: 3.0.3
info:
  title: ERP API
  version: 0.1.0
  description: >
    Part 00.02 endpoints. Authentication is the development adapter (headers X-Erp-User, X-Erp-Roles,
    X-Erp-Company) until the IAM module exists (defect D-001). Errors use
    { error: { code, message, details[{field,message}], correlationId } }; the codes are listed on the Architecture page
    (VALIDATION_ERROR, BAD_JSON, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VERSION_CONFLICT, PAYLOAD_TOO_LARGE,
    BUSINESS_RULE, RATE_LIMITED, INTERNAL_ERROR, SERVICE_UNAVAILABLE) plus IDEMPOTENCY_KEY_REUSED (422) and
    REQUEST_IN_PROGRESS (409) on endpoints that accept an Idempotency-Key.
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: Liveness check (public)
      responses:
        '200': { description: ok }
  /health/live:
    get:
      summary: Liveness (public). The process is up.
      responses:
        '200': { description: '{ status: ok }' }
  /health/ready:
    get:
      summary: Readiness for ITADM and SYSADM (core.health.view) or a monitoring token in X-Health-Token
      responses:
        '200': { description: '{ status: ok or degraded, checks: { database, queue, storage } }, each check { status, detail, ms }' }
        '401': { description: no identity and no valid token }
        '403': { description: missing core.health.view }
        '503': { description: a dependency failed; the body names which one }
  /api/v1/core/architecture:
    get:
      summary: Architecture guide, module map, error codes and pagination contract (needs core.arch.view; flag ff.core.p0101)
      responses:
        '200': { description: '{ data: { markdown, modules[], errorCodes[], pagination, health } }' }
        '403': { description: missing core.arch.view }
        '404': { description: the flag ff.core.p0101 is OFF for the company }
  /api/v1/core/integrity/run:
    post:
      summary: Run every integrity check now and keep the result (needs core.integrity.run, ITADM; flag ff.core.p0102)
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 8, maxLength: 128 }, description: 'a retry with the same key returns the stored result; the same key with a different request is 422' }
      responses:
        '201': { description: '{ data: { runId, runAt, summary: { pass, fail, notApplicable, criticalFailures }, results[{ code, severity, status, failures, checked, samples[], durationMs }] } }' }
        '403': { description: missing core.integrity.run }
        '404': { description: the flag ff.core.p0102 is OFF for the company }
        '409': { description: REQUEST_IN_PROGRESS, the same Idempotency-Key is still being processed }
        '422': { description: IDEMPOTENCY_KEY_REUSED }
  /api/v1/core/integrity/summary:
    get:
      summary: The last run, with every check and its latest result (needs core.integrity.view)
      responses:
        '200': { description: '{ data: { runId, runAt, triggeredBy, checks[{ code, name, severity, description, last }] } }' }
        '403': { description: missing core.integrity.view }
  /api/v1/core/integrity/runs:
    get:
      summary: History, one row per check per run, newest first (needs core.integrity.view)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
        - { name: sort, in: query, schema: { type: string }, description: 'allowed: run_at, check_code, status, severity' }
        - { name: 'filter[check_code]', in: query, schema: { type: string } }
        - { name: 'filter[status]', in: query, schema: { type: string, enum: [pass, fail, not_applicable] } }
        - { name: 'filter[severity]', in: query, schema: { type: string } }
      responses:
        '200': { description: '{ data: [...], meta: { page, pageSize, total, totalPages } }' }
  /api/v1/core/session:
    get:
      summary: Current user, roles, company, permissions and environment
      responses:
        '200': { description: session }
        '401': { description: no identity }
  /api/v1/core/about:
    get:
      summary: Version, build ID, commit, deployed-at, environment and applied migrations (needs core.about.view)
      responses:
        '200': { description: '{ data: { version, buildId, commit, builtAt, deployedAt, environment, node, migrations[{id, appliedAt}] } }' }
        '401': { description: no identity }
        '403': { description: missing core.about.view (SYSADM and ITADM hold it) }
  /api/v1/core/feature-flags:
    get:
      summary: List flag rows visible to the caller's company (needs core.flag.view)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string }, description: 'comma list, - prefix for descending; allowed: key, environment, changed_at, version' }
        - { name: 'filter[environment]', in: query, schema: { type: string } }
        - { name: 'filter[key]', in: query, schema: { type: string } }
      responses:
        '200': { description: '{ data: [...], meta: { page, pageSize, total, totalPages } }' }
        '400': { description: invalid query }
        '401': { description: no identity }
        '403': { description: missing core.flag.view }
  /api/v1/core/feature-flags/evaluate:
    get:
      summary: Evaluate flags for the caller's scope (any authenticated user)
      parameters:
        - { name: keys, in: query, required: true, schema: { type: string }, description: comma-separated flag keys }
        - { name: company_id, in: query, schema: { type: integer }, description: must equal the caller's company }
        - { name: project_id, in: query, schema: { type: integer } }
      responses:
        '200': { description: '{ data: { "<key>": true|false } }' }
        '403': { description: another company's scope }
  /api/v1/core/feature-flags/{key}:
    patch:
      summary: Set a flag at a scope (needs core.flag.configure; reason required)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, pattern: '^ff\.[a-z0-9_.]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, enabled, reason]
              properties:
                scope:
                  type: object
                  required: [level]
                  properties:
                    level: { type: string, enum: [default, environment, company, project] }
                    environment: { type: string, enum: [development, test, staging, production] }
                    companyId: { type: integer }
                    projectId: { type: integer }
                enabled: { type: boolean }
                reason: { type: string, minLength: 5, maxLength: 500 }
                version: { type: integer, description: required when the scope row already exists }
      responses:
        '200': { description: '{ data: { id, key, enabled, version } }' }
        '400': { description: validation errors with field details }
        '403': { description: missing permission or another company }
        '404': { description: flag not defined }
        '409': { description: stale or missing version }
  /api/v1/core/company-settings:
    get:
      summary: Company legal identity, tax registrations and formats (core.settings.view)
      responses: { '200': { description: '{ data }' }, '403': { description: no permission } }
    put:
      summary: Save the company settings (core.settings.configure, Idempotency-Key, reason required, version for an existing row)
      responses: { '200': { description: '{ data }' }, '400': { description: field errors }, '409': { description: stale version } }
  /api/v1/core/display-settings:
    get:
      summary: Display formats for any signed-in user
      responses: { '200': { description: '{ data }' } }
  /api/v1/core/financial-years:
    get:
      summary: List financial years (core.fy.view)
      responses: { '200': { description: '{ data, meta }' } }
    post:
      summary: Create a year and twelve open periods (core.fy.configure)
      responses: { '201': { description: '{ data }' }, '422': { description: overlapping or invalid year } }
  /api/v1/core/financial-years/{id}:
    get:
      summary: A year with its periods and per-module status
      responses: { '200': { description: '{ data }' }, '404': { description: not found } }
  /api/v1/core/financial-years/{id}/close:
    post:
      summary: Close a year when every period is closed (core.period.manage, Idempotency-Key required)
      responses: { '200': { description: closed }, '422': { description: periods still open } }
  /api/v1/core/periods/{id}/status:
    post:
      summary: Set a module status for a period (core.period.manage)
      responses: { '200': { description: changed }, '409': { description: stale version }, '422': { description: closed period } }
  /api/v1/core/period-reopen-requests:
    post:
      summary: Ask for a closed period to be reopened (core.period.request_reopen, Idempotency-Key required)
      responses: { '201': { description: request raised } }
  /api/v1/core/change-requests:
    get:
      summary: List approval requests (core.requests.view)
      responses: { '200': { description: '{ data, meta }' } }
  /api/v1/core/change-requests/{id}/act:
    post:
      summary: 'Approve, reject or return a request (body: action, comment, version)'
      responses: { '200': { description: decided }, '403': { description: not your step or your own request }, '422': { description: already decided } }
  /api/v1/core/document-types:
    get:
      summary: List document types (core.numbering.view)
      responses: { '200': { description: '{ data }' } }
    post:
      summary: Add a document type (core.numbering.configure)
      responses: { '201': { description: '{ data }' } }
  /api/v1/core/number-series:
    get:
      summary: List series with usage and the next number
      responses: { '200': { description: '{ data }' } }
    post:
      summary: Add a series; format, reset rule and statutory limits are validated
      responses: { '201': { description: '{ data }' }, '422': { description: invalid definition } }
  /api/v1/core/number-series/{id}/change-requests:
    post:
      summary: Ask to change a series that has issued numbers (approval chain; Idempotency-Key required)
      responses: { '201': { description: request raised } }
  /api/v1/core/numbering/preview:
    get:
      summary: The next number without consuming it (core.numbering.preview)
      responses: { '200': { description: '{ data: { number } }' } }
  /api/v1/core/numbering/next:
    post:
      summary: Issue a number for a non gap-free series (core.numbering.issue, Idempotency-Key required)
      responses: { '201': { description: '{ data: { number, seq } }' }, '422': { description: gap-free series must be issued inside a document transaction } }
  /api/v1/core/numbering/issues:
    get:
      summary: The issue log
      responses: { '200': { description: '{ data, meta }' } }
  /api/v1/core/parameters:
    get:
      summary: Parameter values with state current, future or past (core.param.view)
      responses: { '200': { description: '{ data }' } }
    post:
      summary: Set a value from an effective date; the old value is kept
      responses: { '201': { description: '{ data }' }, '403': { description: scope not allowed }, '409': { description: a value already starts that day }, '422': { description: past date or scope not allowed } }
  /api/v1/core/parameters/definitions:
    get:
      summary: Declared parameters with type, default, limits and scopes
      responses: { '200': { description: '{ data }' } }
  /api/v1/core/parameters/resolve:
    get:
      summary: The value in force for a key, date, project and site
      responses: { '200': { description: '{ data: { value, source } }' } }
  /api/v1/core/holiday-calendars:
    get:
      summary: Calendars with holiday counts
      responses: { '200': { description: '{ data }' } }
    post:
      summary: Add a calendar (core.holiday.configure)
      responses: { '201': { description: '{ data }' } }
  /api/v1/core/holiday-calendars/{id}:
    get:
      summary: A calendar with its holidays between from and to
      responses: { '200': { description: '{ data }' } }
  /api/v1/core/holiday-calendars/{id}/holidays:
    post:
      summary: Add a holiday
      responses: { '201': { description: '{ data }' }, '409': { description: date already listed } }
  /api/v1/core/holiday-calendars/{id}/import:
    post:
      summary: 'Import rows { date, name, type } all or nothing (max 400)'
      responses: { '200': { description: '{ data: { added, updated, unchanged } }' }, '400': { description: every bad row listed, nothing saved } }
  /api/v1/core/holidays/{id}:
    patch:
      summary: Edit a holiday (version required)
      responses: { '200': { description: '{ data }' } }
    delete:
      summary: Delete a holiday
      responses: { '200': { description: deleted } }
  /api/v1/core/holidays/check:
    get:
      summary: Is a date a holiday for a state or site
      responses: { '200': { description: '{ data: { isHoliday, matches } }' } }
  /api/v1/core/events:
    get:
      summary: The event log, newest first, with masked data (core.events.view; company and system events only)
      responses: { '200': { description: '{ data, meta }' }, '400': { description: unknown filter or page size } }
  /api/v1/core/events/metrics:
    get:
      summary: Throughput, relay and delivery lag, dead letters and per-consumer counts (core.events.view)
      responses: { '200': { description: '{ data: { events, inbox, consumers } }' } }
  /api/v1/core/events/types:
    get:
      summary: The event catalogue with versions and schemas
      responses: { '200': { description: '{ data }' } }
  /api/v1/core/events/consumers:
    get:
      summary: Registered consumers and what they listen to
      responses: { '200': { description: '{ data }' } }
  /api/v1/core/events/dlq:
    get:
      summary: 'Dead letters (filter[status] = DEAD, DISCARDED or PENDING; filter[consumer])'
      responses: { '200': { description: '{ data, meta }; payloads masked' } }
  /api/v1/core/events/dlq/{id}/redrive:
    post:
      summary: Put a dead letter back in the queue with fresh attempts (core.events.redrive, Idempotency-Key and reason required)
      responses: { '200': { description: '{ data }' }, '403': { description: missing permission }, '404': { description: not found in your scope }, '422': { description: not a dead letter } }
  /api/v1/core/events/dlq/{id}/discard:
    post:
      summary: Discard a dead letter on purpose (core.events.redrive, Idempotency-Key and reason required)
      responses: { '200': { description: '{ data }' }, '422': { description: not a dead letter } }
  /api/v1/core/events/replay:
    post:
      summary: 'Queue a replay as a background job (body: types[], from, to, consumer, reset, reason; core.events.replay, Idempotency-Key required)'
      responses: { '202': { description: '{ data: job }' }, '404': { description: unknown consumer }, '400': { description: invalid range or pattern } }
  /api/v1/core/jobs:
    get:
      summary: Background jobs (filter[status], filter[type]; core.jobs.view; company and system jobs only)
      responses: { '200': { description: '{ data, meta }' } }
  /api/v1/core/jobs/types:
    get:
      summary: Registered job types
      responses: { '200': { description: '{ data }' } }
  /api/v1/core/jobs/{id}:
    get:
      summary: One job with progress, log and result
      responses: { '200': { description: '{ data }' }, '404': { description: not found in your scope } }
  /api/v1/core/jobs/{id}/cancel:
    post:
      summary: Cancel a queued job, or ask a running one to stop (core.jobs.manage, Idempotency-Key required)
      responses: { '200': { description: '{ data }' }, '422': { description: already finished } }
  /api/v1/core/jobs/{id}/retry:
    post:
      summary: Queue a failed or cancelled job again (core.jobs.manage, Idempotency-Key required)
      responses: { '201': { description: '{ data: new job }' }, '422': { description: job is not failed or cancelled } }
  /api/v1/core/schedules:
    get:
      summary: Schedules with last and next run (core.schedule.view)
      responses: { '200': { description: '{ data }' } }
  /api/v1/core/schedules/preview:
    get:
      summary: The next run times for a cron expression (IST)
      responses: { '200': { description: '{ data: { nextRuns } }' }, '400': { description: invalid expression } }
  /api/v1/core/schedules/{id}/change-requests:
    post:
      summary: Ask to change a schedule's cron or enabled flag (core.schedule.manage; approved by the System Administrator; Idempotency-Key required)
      responses: { '201': { description: request raised }, '409': { description: an open request exists }, '422': { description: nothing would change } }
  /api/v1/core/files:
    get:
      summary: 'Files attached to a record (query: entity, entityId); needs view permission on the record'
      responses: { '200': { description: '{ data: [file] } with scan status, version and metadata; never the storage key' }, '403': { description: no view permission on the record }, '404': { description: record not found in your company } }
    post:
      summary: 'Upload one file as multipart/form-data (fields: entity, entityId, supersedesId, stripExif; part: file). Needs edit permission on the record'
      responses: { '201': { description: '{ data: file } with scanStatus PENDING' }, '409': { description: DUPLICATE_FILE }, '413': { description: larger than any limit }, '422': { description: FILE_REJECTED (type, content or size) } }
  /api/v1/core/files/uploads:
    post:
      summary: 'Start a resumable upload (fileName, size, entity, entityId, supersedesId, stripExif)'
      responses: { '201': { description: '{ data: { uploadId, received, chunkSize, expiresAt } }' }, '422': { description: type or size not allowed } }
  /api/v1/core/files/uploads/{uploadId}:
    get:
      summary: How many bytes the server has (use it to resume after a dropped connection)
      responses: { '200': { description: '{ data: { received, size, status } }' } }
    put:
      summary: 'Append a chunk at ?offset= (application/octet-stream). A chunk that stops half way counts for nothing'
      responses: { '200': { description: '{ data: { received } }' }, '409': { description: offset is not where the server stopped; resume from the number in the message }, '422': { description: more than was declared, or expired } }
  /api/v1/core/files/uploads/{uploadId}/complete:
    post:
      summary: Finish a resumable upload; runs every check. Completing twice returns the same file
      responses: { '201': { description: '{ data: file }' }, '409': { description: bytes missing } }
  /api/v1/core/files/{id}:
    get:
      summary: File metadata (view permission on the linked record)
      responses: { '200': { description: '{ data: file }' }, '404': { description: not found or deleted } }
    delete:
      summary: Soft delete (edit permission; refused with 422 when the record is approved: upload a new version instead)
      responses: { '200': { description: '{ data: { id, deleted } }' }, '422': { description: record is locked } }
  /api/v1/core/files/{id}/url:
    get:
      summary: 'A short-lived signed download link (query: variant = file or thumbnail, download). Only CLEAN files have one'
      responses: { '200': { description: '{ data: { url, expiresAt, disposition } }' }, '409': { description: FILE_NOT_AVAILABLE (scanning, quarantined or scan failed) } }
  /api/v1/core/files/{id}/content:
    get:
      summary: 'The file itself, for a valid signed link (no sign-in). Supports Range. Content type comes from the validated type'
      responses: { '200': { description: file bytes }, '206': { description: partial content }, '403': { description: link not valid }, '410': { description: LINK_EXPIRED }, '416': { description: range not satisfiable } }
  /api/v1/core/files/{id}/rescan:
    post:
      summary: Scan again a file whose scan failed or never ran (core.files.admin, Idempotency-Key)
      responses: { '200': { description: '{ data: file }' }, '422': { description: file is clean or quarantined } }
  /api/v1/core/files/overview:
    get:
      summary: Scan status counts, storage and scanners, files by category and files needing attention (core.files.admin)
      responses: { '200': { description: '{ data }' } }
  /api/v1/core/files/admin:
    get:
      summary: 'All files of the company (filter[scan_status]; core.files.admin)'
      responses: { '200': { description: '{ data, meta }' } }
  /api/v1/core/files/settings:
    get:
      summary: The file settings in force, the known file types and the hard ceiling (core.files.admin)
      responses: { '200': { description: '{ data }' } }
  /api/v1/core/files/settings/change-requests:
    post:
      summary: Ask to change types, size limits, retention classes or link life (core.files.configure; approved by the IT Administrator)
      responses: { '201': { description: request raised }, '409': { description: an open request exists }, '422': { description: nothing would change } }
  /api/v1/core/formulas:
    get:
      summary: The formula registry, one row per formula (core.calc.view; q, filter[owner_module], filter[status])
      responses: { '200': { description: '{ data: [{ code, ownerModule, currentVersion, latestVersion, hasDraft, hasShadow }], meta }' } }
    post:
      summary: Register a new formula as version 1, a draft (core.calc.manage)
      responses: { '201': { description: '{ data: version }' }, '400': { description: syntax, unknown name or undeclared output }, '409': { description: code exists } }
  /api/v1/core/formulas/{code}:
    get:
      summary: All versions of a formula with their state, and the approval chain for a new version
      responses: { '200': { description: '{ data: { code, approvalChain, versions } }' }, '404': { description: unknown formula } }
  /api/v1/core/formulas/{code}/versions:
    post:
      summary: Draft a new version, by default a copy of the latest (core.calc.manage). Only one draft at a time
      responses: { '201': { description: '{ data: version }' }, '409': { description: a draft exists } }
  /api/v1/core/formulas/{code}/versions/{version}:
    patch:
      summary: Edit a draft (optimistic lock in body.version). A version that is no longer a draft cannot be edited
      responses: { '200': { description: '{ data: version }' }, '409': { description: not a draft, or stale } }
  /api/v1/core/formulas/{code}/versions/{version}/check:
    get:
      summary: Problems with the definition and the result of the version's own test cases
      responses: { '200': { description: '{ data: { problems, tests } }' } }
  /api/v1/core/formulas/{code}/versions/{version}/shadow:
    post:
      summary: Run a draft beside the active version from now on (needs passing tests; Idempotency-Key; core.calc.manage)
      responses: { '200': { description: '{ data: version }' }, '422': { description: no tests, failing tests or nothing active to compare with } }
  /api/v1/core/formulas/{code}/versions/{version}/shadow/stop:
    post:
      summary: Stop shadow mode; the version is retired
      responses: { '200': { description: '{ data: version }' } }
  /api/v1/core/formulas/{code}/versions/{version}/activation-requests:
    post:
      summary: Ask for a draft or shadow version to become active (tests pass, date today or later). Approved by the owner manager, then the CFO for financial formulas
      responses: { '201': { description: approval request }, '409': { description: an open request exists }, '422': { description: tests, date or definition } }
  /api/v1/core/formulas/{code}/test:
    post:
      summary: 'The test bench: evaluate a stored version, the version in force on a date, or an unsaved draft definition. Keeps nothing (core.calc.view)'
      responses: { '200': { description: '{ data: { result, trace, formula } }' }, '422': { description: invalid input, naming the step } }
  /api/v1/core/formulas/{code}/compare:
    post:
      summary: Run two versions on pasted cases and recent real inputs and report every difference (core.calc.view)
      responses: { '200': { description: '{ data: { summary, results } }' } }
  /api/v1/core/formulas/{code}/shadow-summary:
    get:
      summary: What the live shadow run has found for a version so far
      responses: { '200': { description: '{ data: { runs, differing, errors, latestDifferences } }' } }
  /api/v1/core/calc-traces:
    get:
      summary: 'The calculations behind a record (query: entity, entityId); needs view permission on the record'
      responses: { '200': { description: '{ data: [trace] }' }, '403': { description: no view permission on the record }, '404': { description: record not found in your company } }
  /api/v1/core/uoms:
    get:
      summary: Units of measure
      responses: { '200': { description: '{ data }' } }
    post:
      summary: Add a unit (core.calc.manage)
      responses: { '201': { description: '{ data }' }, '409': { description: exists } }
  /api/v1/core/uom-conversions:
    get:
      summary: Conversion factors, generic and for one item (query itemCode)
      responses: { '200': { description: '{ data }' } }
    post:
      summary: Add a factor (1 from = factor to); an item factor beats a generic one for the same pair
      responses: { '201': { description: '{ data }' }, '409': { description: pair exists }, '404': { description: unknown unit } }
  /api/v1/core/uom-conversions/{id}:
    delete:
      summary: Remove a factor (soft delete)
      responses: { '200': { description: '{ data: { id, deleted } }' } }
  /api/v1/core/calc/convert:
    post:
      summary: Convert a quantity between units, with the route taken (core.calc.view)
      responses: { '200': { description: '{ data: { result, path } }' }, '422': { description: no conversion } }
  /api/v1/core/sample-bills:
    get:
      summary: Sample bills with their calculated amounts and the formula versions used (core.sample.use)
      responses: { '200': { description: '{ data, meta }' } }
    post:
      summary: Create a bill; every amount is calculated by the server
      responses: { '201': { description: '{ data: bill }' } }
  /api/v1/core/sample-bills/{id}:
    patch:
      summary: Change a draft bill's inputs and recalculate (optimistic lock)
      responses: { '200': { description: '{ data: bill }' }, '422': { description: bill is submitted } }
  /api/v1/core/sample-bills/{id}/submit:
    post:
      summary: Submit a bill; amounts and formula versions are fixed (Idempotency-Key required)
      responses: { '200': { description: '{ data: bill }' } }
  /api/v1/core/sample-bills/{id}/recalculate:
    post:
      summary: Calculate again - a draft with the versions in force today, a submitted bill with the versions it was calculated with
      responses: { '200': { description: '{ data: bill with recalculation }' } }
  /metrics:
    get:
      summary: Prometheus text metrics (header x-health-token, or a signed-in user with core.ops.view)
      responses: { '200': { description: text/plain }, '401': { description: no token }, '403': { description: no permission } }
  /api/v1/core/ops/summary:
    get:
      summary: Operations dashboard data - requests, errors, latency, queues, database, disk, objectives, alerts, slow queries, browser reports (core.ops.view; ITADM, SYSADM)
      responses: { '200': { description: '{ data }' } }
  /api/v1/core/ops/slos:
    get:
      summary: Service objectives with the measured status (core.ops.view)
      responses: { '200': { description: '{ data: [objective] }' } }
  /api/v1/core/ops/alert-rules:
    get:
      summary: Alert rules (core.ops.view)
      responses: { '200': { description: '{ data: [rule] }' } }
  /api/v1/core/ops/alerts:
    get:
      summary: Alerts, newest first; filter status=OPEN|RESOLVED (core.ops.view)
      responses: { '200': { description: '{ data: [alert] }' } }
  /api/v1/core/ops/alerts/{id}/acknowledge:
    post:
      summary: Acknowledge an alert (core.ops.manage; Idempotency-Key required)
      responses: { '200': { description: '{ data: alert }' }, '404': { description: unknown alert } }
  /api/v1/core/ops/evaluate:
    post:
      summary: Save the metrics and check every alert rule now (core.ops.manage; Idempotency-Key required)
      responses: { '200': { description: '{ data: { fired, resolved } }' } }
  /api/v1/core/ops/slo-definitions/{journey}/change-requests:
    post:
      summary: Ask to change an objective; the System Administrator approves (core.ops.manage)
      responses: { '201': { description: change request }, '409': { description: a request is already open }, '422': { description: nothing would change } }
  /api/v1/core/ops/alert-rules/{code}/change-requests:
    post:
      summary: Ask to change an alert rule; the System Administrator approves (core.ops.manage)
      responses: { '201': { description: change request }, '409': { description: a request is already open }, '422': { description: nothing would change } }
  /api/v1/core/ops/traces:
    get:
      summary: Recent traces held in memory; filters status=ok|error, minMs (core.ops.view)
      responses: { '200': { description: '{ data: [trace] }' } }
  /api/v1/core/ops/traces/{traceId}:
    get:
      summary: One trace with its spans (core.ops.view)
      responses: { '200': { description: '{ data: trace }' }, '404': { description: no longer kept } }
  /api/v1/core/ops/traces/{traceId}/otlp:
    get:
      summary: One trace as OTLP/JSON (core.ops.view)
      responses: { '200': { description: OTLP resourceSpans } }
  /api/v1/core/ops/follow:
    get:
      summary: Everything under one correlation ID - log lines, traces, events, jobs, browser reports (core.ops.view; query correlationId)
      responses: { '200': { description: '{ data }' } }
  /api/v1/core/ops/client-events:
    post:
      summary: Browser error, failed-call and page-load reports (any signed-in user; at most 20 per request and 60 a minute; works even when ff.core.p0107 is off)
      responses: { '202': { description: '{ data: { recorded } }' }, '422': { description: too many reports } }
    get:
      summary: Recent browser reports; filter type=js_error|api_failure|page_load (core.ops.view)
      responses: { '200': { description: '{ data: [report] }' } }
  /api/v1/core/ops/baseline:
    get:
      summary: The stored performance baseline (core.ops.view)
      responses: { '200': { description: '{ data: { available, journeys, environment, dataset } }' } }
  /api/v1/core/ops/diagnostics/force-error:
    post:
      summary: Log, raise an event, queue a job, then fail on purpose with a 500 that carries the correlation ID (core.ops.manage; Idempotency-Key required)
      responses: { '500': { description: error envelope with correlationId } }
  /api/v1/core/connectors/catalog:
    get:
      summary: Connector types, their providers, settings and credentials, and which types need the CFO (core.connectors.view)
      responses: { '200': { description: '{ data: [type] }' } }
  /api/v1/core/connectors:
    get:
      summary: Connectors of the company with health and circuit state; filters type, status, environment; search q (core.connectors.view)
      responses: { '200': { description: '{ data, meta }' } }
    post:
      summary: Ask for a new connector; it exists switched off until approved. Credentials go in the body once and are never returned (core.connectors.configure; Idempotency-Key required)
      responses: { '201': { description: '{ data: { connector, request } }' }, '409': { description: code already used }, '422': { description: unknown provider or missing credential } }
  /api/v1/core/connectors/{id}:
    get:
      summary: One connector with credential names and dates (never values), webhook details and whether a request is open (core.connectors.view)
      responses: { '200': { description: '{ data }' }, '404': { description: unknown or another company } }
  /api/v1/core/connectors/{id}/secrets:
    get:
      summary: Credential names, state, rotation and expiry dates - no values (core.connectors.view)
      responses: { '200': { description: '{ data: [{ key, status, isSet, rotatedAt, expiresAt, expired }] }' } }
  /api/v1/core/connectors/{id}/change-requests:
    post:
      summary: Ask to change settings, limits, credentials or the on/off state; approved by SYSADM (and CFO for bank and GST) (core.connectors.configure; Idempotency-Key required)
      responses: { '201': { description: change request }, '409': { description: a request is already open }, '422': { description: nothing would change } }
  /api/v1/core/connectors/{id}/disable:
    post:
      summary: Switch a connector off at once (a safety control); switching on needs an approved request (core.connectors.configure; Idempotency-Key required)
      responses: { '200': { description: '{ data: connector }' }, '422': { description: not switched on } }
  /api/v1/core/connectors/{id}/test:
    post:
      summary: Test connection - one health request, recorded on the connector and in the log (core.connectors.configure; Idempotency-Key required)
      responses: { '200': { description: '{ data: { status, message, durationMs } }' }, '409': { description: waiting for approval } }
  /api/v1/core/connectors/{id}/sample:
    post:
      summary: Send the provider's sample operation through the abstraction, for example a test email (core.connectors.configure; Idempotency-Key required)
      responses: { '200': { description: '{ data: { operation, result, attempts, durationMs, logId } }' }, '429': { description: rate limit }, '503': { description: provider failing or circuit open } }
  /api/v1/core/integration-logs:
    get:
      summary: Redacted call log; filters connector, status, direction, from, to, q (core.connectors.view)
      responses: { '200': { description: '{ data, meta }' } }
  /api/v1/core/integration-logs/{id}:
    get:
      summary: One log entry with the redacted request and response (core.connectors.view)
      responses: { '200': { description: '{ data }' }, '404': { description: unknown or another company } }
  /api/v1/core/webhooks/{connector}:
    post:
      summary: Inbound webhook (no sign-in). Headers x-timestamp, x-signature (HMAC-SHA256 of timestamp.body), optional x-delivery-id; a replay answers 200 with duplicate true
      responses: { '200': { description: '{ data: { received, duplicate, deliveryId } }' }, '401': { description: bad or missing signature }, '404': { description: unknown, off or unconfigured }, '429': { description: too many deliveries } }
  /api/v1/iam/auth/config:
    get:
      summary: How people sign in here (public)
      responses: { '200': { description: '{ data: { mode, passwordMinLength, rememberDeviceDays, sso } }' } }
  /api/v1/iam/auth/login:
    post:
      summary: Sign in with username, email or mobile and a password (public). Answers ok, mfa_required, mfa_enrolment_required or password_change_required; every failure is the same 401
      responses: { '200': { description: '{ data: { status, accessToken, expiresIn, user, session, challengeToken, factors } }; the refresh token is set as an HttpOnly cookie' }, '401': { description: sign-in failed (never says why) }, '429': { description: too many attempts } }
  /api/v1/iam/auth/captcha:
    post:
      summary: Whether a sign-in name needs a CAPTCHA, and the question (public; same answer for names that do not exist)
      responses: { '200': { description: '{ data: { required, challenge } }' } }
  /api/v1/iam/auth/mfa/verify:
    post:
      summary: Second step - totp, backup, sms or whatsapp code (public, needs the challengeToken)
      responses: { '200': { description: '{ data: { status: ok, ... } }' }, '401': { description: code wrong or expired } }
  /api/v1/iam/auth/mfa/send:
    post:
      summary: Send a one-time code to the chosen text or WhatsApp factor (public, needs the challengeToken)
      responses: { '200': { description: '{ data: { sent } }' } }
  /api/v1/iam/auth/mfa/enrol/begin:
    post:
      summary: Start authenticator set-up during sign-in for a role that needs one (public, needs the challengeToken)
      responses: { '200': { description: '{ data: { secret, uri, qr } }' } }
  /api/v1/iam/auth/mfa/enrol/confirm:
    post:
      summary: Confirm the first code; completes the sign-in and returns the backup codes once
      responses: { '200': { description: '{ data: { status: ok, backupCodes, ... } }' }, '401': { description: code wrong } }
  /api/v1/iam/auth/password/required-change:
    post:
      summary: Set a new password when the sign-in says one is required (public, needs the challengeToken)
      responses: { '200': { description: next step of the sign-in }, '422': { description: password not acceptable } }
  /api/v1/iam/auth/password/forgot:
    post:
      summary: Send a reset code to the email on file; the same answer whether or not the account exists (public)
      responses: { '200': { description: '{ data: { sent } }' } }
  /api/v1/iam/auth/password/reset:
    post:
      summary: Set a new password with the reset code; ends every session of the person (public)
      responses: { '200': { description: '{ data: { reset } }' }, '422': { description: code wrong or expired, or password not acceptable } }
  /api/v1/iam/auth/password/change:
    post:
      summary: Change your own password; ends your other sessions (needs sign-in)
      responses: { '200': { description: '{ data: { changed, otherSessionsEnded } }' }, '422': { description: current password wrong or new one not acceptable } }
  /api/v1/iam/auth/refresh:
    post:
      summary: A new access token and a replaced refresh token (cookie with x-erp-csrf, or refreshToken in the body); reuse of a replaced token ends the session
      responses: { '200': { description: '{ data: { status: ok, accessToken, ... } }' }, '401': { description: token unknown, expired or reused } }
  /api/v1/iam/auth/resume:
    post:
      summary: Pick the session up again from the cookie on page load; "nobody signed in" is a 200
      responses: { '200': { description: '{ data: { status: ok | signed_out } }' } }
  /api/v1/iam/auth/logout:
    post:
      summary: End the session (by access token or refresh cookie) and clear the cookie
      responses: { '200': { description: '{ data: { ok } }' } }
  /api/v1/iam/auth/pin-unlock:
    post:
      summary: Open a session on a remembered device with its PIN (public); not for roles that need a second step
      responses: { '200': { description: session }, '401': { description: PIN wrong } }
  /api/v1/iam/me:
    get:
      summary: Your profile, second steps and password dates (signed in)
      responses: { '200': { description: '{ data }' } }
  /api/v1/iam/me/sessions:
    get:
      summary: Your active sessions
      responses: { '200': { description: '{ data: [session] }' } }
  /api/v1/iam/me/sessions/{id}:
    delete:
      summary: Sign out one of your sessions
      responses: { '200': { description: '{ data: { ended } }' }, '404': { description: not yours } }
  /api/v1/iam/me/sessions/sign-out-others:
    post:
      summary: Sign out every session but this one (Idempotency-Key required)
      responses: { '200': { description: '{ data: { ended } }' } }
  /api/v1/iam/me/devices:
    get:
      summary: Your registered devices
      responses: { '200': { description: '{ data: [device] }' } }
  /api/v1/iam/me/devices/{id}:
    delete:
      summary: Forget a device; its sessions end
      responses: { '200': { description: '{ data: { removed } }' } }
  /api/v1/iam/me/devices/{id}/pin:
    post:
      summary: Set the quick-unlock PIN of a remembered device (Idempotency-Key required)
      responses: { '200': { description: '{ data: { set } }' }, '422': { description: PIN too simple, device not remembered, or role needs a second step } }
  /api/v1/iam/me/login-events:
    get:
      summary: Your recent sign-in activity
      responses: { '200': { description: '{ data: [event] }' } }
  /api/v1/iam/me/mfa/totp/begin:
    post:
      summary: Start authenticator set-up (Idempotency-Key required)
      responses: { '200': { description: '{ data: { secret, uri, qr } }' } }
  /api/v1/iam/me/mfa/totp/confirm:
    post:
      summary: Confirm the first code; returns the backup codes once (Idempotency-Key required)
      responses: { '200': { description: '{ data: { backupCodes } }' }, '422': { description: code wrong } }
  /api/v1/iam/me/mfa/phone/begin:
    post:
      summary: Send a verification code to a mobile number by text or WhatsApp (Idempotency-Key required)
      responses: { '200': { description: '{ data: { sent } }' }, '503': { description: the connector could not send } }
  /api/v1/iam/me/mfa/phone/confirm:
    post:
      summary: Confirm the phone code (Idempotency-Key required)
      responses: { '200': { description: '{ data: { ok } }' }, '422': { description: code wrong or expired } }
  /api/v1/iam/me/mfa/backup-codes:
    post:
      summary: Replace the backup codes (Idempotency-Key required)
      responses: { '200': { description: '{ data: { backupCodes } }' } }
  /api/v1/iam/me/mfa/{id}:
    delete:
      summary: Remove a second step; a role that needs one cannot remove the last
      responses: { '200': { description: '{ data: { removed } }' }, '422': { description: last factor of a role that needs one } }
  /api/v1/iam/admin/policy:
    get:
      summary: The authentication policy, its change history and whether a change is open (iam.security.view)
      responses: { '200': { description: '{ data: { settings, history, openRequest } }' } }
  /api/v1/iam/admin/policy/change-requests:
    post:
      summary: Ask to change the policy; the other administrator approves (iam.security.manage; Idempotency-Key required)
      responses: { '201': { description: change request }, '409': { description: a request is already open }, '422': { description: nothing would change } }
  /api/v1/iam/admin/sessions:
    get:
      summary: Active sessions of the company (iam.security.view)
      responses: { '200': { description: '{ data, meta }' } }
  /api/v1/iam/admin/sessions/{id}/revoke:
    post:
      summary: Force a sign-out of one session with a reason (iam.security.manage; Idempotency-Key required)
      responses: { '200': { description: '{ data: { ended } }' } }
  /api/v1/iam/admin/users:
    get:
      summary: Users with second-step, lock and session state (iam.security.view)
      responses: { '200': { description: '{ data, meta }' } }
  /api/v1/iam/admin/users/{username}/sign-out:
    post:
      summary: Sign a person out everywhere (iam.security.manage; Idempotency-Key required)
      responses: { '200': { description: '{ data: { ended } }' } }
  /api/v1/iam/admin/users/{username}/unlock:
    post:
      summary: Clear a lockout (iam.security.manage; Idempotency-Key required)
      responses: { '200': { description: '{ data: { unlocked } }' } }
  /api/v1/iam/admin/login-events:
    get:
      summary: Login history; filters user, result, from, to, q (iam.security.view)
      responses: { '200': { description: '{ data, meta }' } }
