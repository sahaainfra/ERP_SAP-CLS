openapi: 3.0.3
info:
  title: ERP External Portal API
  version: '25.02'
  description: External access requires a portal-issued bearer session. Internal management uses ERP authentication and role permissions.
paths:
  /api/v1/portal/invitation:
    post:
      summary: Get the authenticator setup details for an unexpired invitation
      description: Requires the invitation token in the JSON body. G1 and G2 and ff.portal.p2501 must be enabled for the host company.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } }, additionalProperties: false }
      responses: { '200': { description: "Account reference, authenticator setup key and terms version" }, '400': { description: "Invalid body" }, '401': { description: "Invitation unavailable" } }
  /api/v1/portal/activation:
    post:
      summary: Activate a portal account using the invitation and a time-based OTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, password, code, termsVersion], properties: { token: { type: string }, password: { type: string, format: password }, code: { type: string }, termsVersion: { type: string } }, additionalProperties: false }
      responses: { '200': { description: "Account reference" }, '400': { description: "Invalid input or password policy" }, '401': { description: "Invitation unavailable or code invalid" } }
  /api/v1/portal/session:
    post:
      summary: Authenticate with the account reference, password and time-based OTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [account, password, code], properties: { account: { type: string }, password: { type: string, format: password }, code: { type: string } }, additionalProperties: false }
      responses: { '200': { description: "Portal bearer token" }, '401': { description: "Sign-in refused" }, '429': { description: "Rate limited" } }
    delete:
      security: [{ PortalBearer: [] }]
      summary: Revoke the current portal bearer session
      responses: { '204': { description: "Session revoked" }, '401': { description: "Session unavailable" } }
  /api/v1/portal/profile:
    get:
      security: [{ PortalBearer: [] }]
      summary: Read the company and contact profile from the authenticated portal scope
      responses: { '200': { description: "Company name, scoped partner name and contact, role, account reference and terms timestamp" }, '401': { description: "Portal session required" } }
  /api/v1/portal/profile/requests:
    post:
      security: [{ PortalBearer: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      summary: Request a profile change with a portal bearer and an Idempotency-Key
      responses: { '201': { description: "Request reference" }, '400': { description: "Invalid subject, message or key" }, '401': { description: "Portal session required" }, '409': { description: "Key reused with different details" } }
  /api/v1/portal/messages:
    get:
      security: [{ PortalBearer: [] }]
      summary: List the current portal account's notices and profile requests
      responses: { '200': { description: "Notices and requests" }, '401': { description: "Portal session required" } }
  /api/v1/portal/messages/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      security: [{ PortalBearer: [] }]
      summary: Mark the current portal account's notice read
      responses: { '200': { description: "Read" }, '401': { description: "Portal session required" }, '404': { description: "Notice unavailable in this scope" } }
  /api/v1/portal/documents:
    get:
      security: [{ PortalBearer: [] }]
      summary: List available explicitly shared revisions for the current portal account
      responses: { '200': { description: "Shared revision titles and share IDs" }, '401': { description: "Portal session required" } }
  /api/v1/portal/documents/{id}/ticket:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      security: [{ PortalBearer: [] }]
      summary: Issue a 60-second signed download ticket bound to the portal session and share
      responses: { '200': { description: "Ticket" }, '401': { description: "Portal session required" }, '404': { description: "Share unavailable in this scope" } }
  /api/v1/portal/documents/{id}/content:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: X-Portal-Download, in: header, required: true, schema: { type: string } }
    get:
      security: [{ PortalBearer: [] }]
      summary: Download a watermarked revision with a current portal session and signed ticket
      responses: { '200': { description: "Watermarked attachment" }, '401': { description: "Invalid session or ticket" }, '404': { description: "Share unavailable in this scope" } }
  /api/v1/portal/registrations:
    post:
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 43 } }
      summary: Submit a prospective vendor to the existing partner activation workflow
      description: Supply the company code, business name, constitution, PAN where applicable, contact, registered address and state code. Keep the 43-character random Idempotency-Key as a private access receipt.
      responses: { '202': { description: "Registration reference and approval status" }, '400': { description: "Invalid data" }, '404': { description: "Intake unavailable" }, '409': { description: "Conflicting or duplicate submission" } }
  /api/v1/portal/registrations/status:
    post:
      summary: Read one registration's status using its private receipt in the JSON body
      responses: { '200': { description: "Registration reference, status and version" }, '404': { description: "Registration unavailable" } }
  /api/v1/portal/registrations/revise:
    post:
      security: [{ RegistrationReceipt: [] }]
      summary: Correct a returned registration using its receipt as bearer and its current record version
      responses: { '202': { description: "Resubmitted for approval" }, '404': { description: "Registration unavailable" }, '409': { description: "Wrong state or version" } }
  /api/v1/portal/admin/invitations:
    post:
      security: [{ ErpBearer: [] }]
      summary: Invite an active partner contact or client or consultant project stakeholder (portal.account.invite)
      description: Supply partnerId and contactId, or stakeholderId, with portalType. The internal identity must cover the source record scope.
      responses: { '201': { description: "Single-use 24-hour invitation and account reference" }, '403': { description: "Missing permission or scope" }, '404': { description: "Source or portal unavailable" }, '409': { description: "Current account or invitation exists" } }
  /api/v1/portal/admin/accounts:
    get:
      security: [{ ErpBearer: [] }]
      summary: List portal accounts belonging to the administrator's company (portal.account.view)
      responses: { '200': { description: "Paginated rows with q, filter[status], sort, page and pageSize" }, '403': { description: "Missing permission" }, '404': { description: "Portal unavailable" } }
  /api/v1/portal/admin/accounts/export:
    get:
      security: [{ ErpBearer: [] }]
      summary: Export filtered account metadata in CSV, XLSX or PDF (portal.account.export)
      responses: { '200': { description: "Filtered export" }, '202': { description: "Export queued" }, '400': { description: "Invalid format or filter" }, '403': { description: "Missing permission" } }
  /api/v1/portal/admin/accounts/{id}/revoke:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      security: [{ ErpBearer: [] }]
      summary: Revoke credentials and sessions with the current account version (portal.account.manage)
      responses: { '200': { description: "Account revoked" }, '403': { description: "Missing permission" }, '404': { description: "Account unavailable" }, '409': { description: "Version conflict" } }
  /api/v1/portal/admin/accounts/{id}/notices:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      security: [{ ErpBearer: [] }]
      summary: Send a subject and message to one external account (portal.account.manage)
      responses: { '201': { description: "Notice sent" }, '403': { description: "Missing permission" }, '404': { description: "Account unavailable" } }
  /api/v1/portal/admin/accounts/{id}/requests:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      security: [{ ErpBearer: [] }]
      summary: List profile requests for an account within the administrator's company (portal.account.manage)
      responses: { '200': { description: "Scoped requests" }, '403': { description: "Missing permission" }, '404': { description: "Account unavailable" } }
  /api/v1/portal/admin/accounts/{id}/requests/{requestId}/close:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: requestId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      security: [{ ErpBearer: [] }]
      summary: Close a profile request and send a response using its current version (portal.account.manage)
      responses: { '200': { description: "Closed" }, '403': { description: "Missing permission" }, '404': { description: "Request unavailable" }, '409': { description: "Version conflict" } }
  /api/v1/portal/admin/accounts/{id}/shares:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      security: [{ ErpBearer: [] }]
      summary: Share the current clean issued revision with an active portal account (portal.account.manage and document access)
      responses: { '201': { description: "Share ID" }, '403': { description: "Missing portal permission" }, '404': { description: "Account or shareable revision unavailable" } }
  /api/v1/portal/admin/accounts/revoke:
    post:
      security: [{ ErpBearer: [] }]
      summary: Revoke invitations and sessions for selected accounts (portal.account.manage)
      responses: { '200': { description: "Outcome for each of up to 200 account IDs" }, '403': { description: "Missing permission" } }
  /api/v1/portal/supplier/rfqs:
    get:
      summary: List RFQs addressed to the current supplier
      security: [{ PortalBearer: [] }]
      parameters:
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: "A data object with up to 50 items and a nextBefore cursor" }
        '401': { $ref: '#/components/responses/PortalSession' }
        '403': { $ref: '#/components/responses/SupplierAccount' }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
  /api/v1/portal/supplier/rfqs/{id}:
    parameters: [{ $ref: '#/components/parameters/SupplierRecordId' }]
    get:
      summary: Read an invited RFQ and the current supplier quotation
      security: [{ PortalBearer: [] }]
      responses:
        '200': { description: "RFQ terms, lines, allowed clarifications, current quotation and revision to submit" }
        '401': { $ref: '#/components/responses/PortalSession' }
        '403': { $ref: '#/components/responses/SupplierAccount' }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
  /api/v1/portal/supplier/orders:
    get:
      summary: List purchase orders for the current supplier
      security: [{ PortalBearer: [] }]
      parameters:
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: "A data object with up to 50 items and a nextBefore cursor" }
        '401': { $ref: '#/components/responses/PortalSession' }
        '403': { $ref: '#/components/responses/SupplierAccount' }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
  /api/v1/portal/supplier/orders/{id}:
    parameters: [{ $ref: '#/components/parameters/SupplierRecordId' }]
    get:
      summary: Read a purchase order and its delivery schedule
      security: [{ PortalBearer: [] }]
      responses:
        '200': { description: "Order, version, acknowledgment, dispatches and receipts with enabled invoice, payment and milestone projections" }
        '401': { $ref: '#/components/responses/PortalSession' }
        '403': { $ref: '#/components/responses/SupplierAccount' }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
  /api/v1/portal/supplier/orders/{id}/milestones:
    parameters: [{ $ref: '#/components/parameters/SupplierRecordId' }]
    get:
      summary: Read the approved expediting plan for an order
      security: [{ PortalBearer: [] }]
      responses:
        '200': { description: "Plan and supplier-visible milestones with their current versions" }
        '401': { $ref: '#/components/responses/PortalSession' }
        '403': { $ref: '#/components/responses/SupplierAccount' }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
  /api/v1/portal/supplier/scorecards:
    get:
      summary: Read the current supplier's company-wide scorecards
      description: Requires an unscoped company-wide supplier grant and the Procurement scorecard feature.
      security: [{ PortalBearer: [] }]
      responses:
        '200': { description: "Up to 50 scores, newest period first" }
        '401': { $ref: '#/components/responses/PortalSession' }
        '403': { $ref: '#/components/responses/SupplierAccount' }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
  /api/v1/portal/supplier/rfqs/{id}/quotations:
    parameters:
      - { $ref: '#/components/parameters/SupplierRecordId' }
    post:
      summary: Submit or revise a quotation before the RFQ closes
      security: [{ PortalBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierIdempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, data]
              properties:
                version: { type: integer, minimum: 0 }
                fileIds:
                  type: array
                  maxItems: 5
                  items: { type: integer, minimum: 1 }
                data:
                  type: object
                  additionalProperties: false
                  required: [validUntil, lines]
                  properties:
                    quoteRef: { type: string, maxLength: 60, nullable: true }
                    validUntil: { type: string, format: date }
                    deliveryDays: { type: integer, minimum: 0, maximum: 1000 }
                    paymentTerms: { type: string, maxLength: 300, nullable: true }
                    freightTerms: { type: string, maxLength: 300, nullable: true }
                    gstInclusive: { type: boolean }
                    deviations: { type: string, maxLength: 1000, nullable: true }
                    lines:
                      type: array
                      minItems: 1
                      maxItems: 300
                      items: { $ref: '#/components/schemas/SupplierQuoteLine' }
      responses:
        '201': { description: "Procurement quotation reference and version" }
        '400': { description: "Missing key, invalid input or domain validation failed" }
        '401': { $ref: '#/components/responses/PortalSession' }
        '403': { $ref: '#/components/responses/SupplierAccount' }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
        '409': { description: "Record is closed, version changed or request already processing" }
        '422': { description: "Key reused with a different request" }
  /api/v1/portal/supplier/rfqs/{id}/clarifications:
    parameters:
      - { $ref: '#/components/parameters/SupplierRecordId' }
    post:
      summary: Send the buyer a clarification question on an open RFQ
      security: [{ PortalBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierIdempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '201': { description: "Question recorded" }
        '400': { description: "Missing key, invalid input or domain validation failed" }
        '401': { $ref: '#/components/responses/PortalSession' }
        '403': { $ref: '#/components/responses/SupplierAccount' }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
        '409': { description: "Record is closed, version changed or request already processing" }
        '422': { description: "Key reused with a different request" }
  /api/v1/portal/supplier/orders/{id}/acknowledgments:
    parameters:
      - { $ref: '#/components/parameters/SupplierRecordId' }
    post:
      summary: Acknowledge an approved order and its delivery schedule
      security: [{ PortalBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierIdempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, data]
              properties:
                version: { type: integer, minimum: 0 }
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    note: { type: string, maxLength: 500, nullable: true }
      responses:
        '200': { description: "Acknowledgment timestamp" }
        '400': { description: "Missing key, invalid input or domain validation failed" }
        '401': { $ref: '#/components/responses/PortalSession' }
        '403': { $ref: '#/components/responses/SupplierAccount' }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
        '409': { description: "Record is closed, version changed or request already processing" }
        '422': { description: "Key reused with a different request" }
  /api/v1/portal/supplier/orders/{id}/dispatches:
    parameters:
      - { $ref: '#/components/parameters/SupplierRecordId' }
    post:
      summary: Record an advance shipping notice against the remaining order quantities
      security: [{ PortalBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierIdempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, data]
              properties:
                version: { type: integer, minimum: 0 }
                fileIds:
                  type: array
                  maxItems: 1
                  items: { type: integer, minimum: 1 }
                data:
                  type: object
                  additionalProperties: false
                  required: [dispatchDate, lines]
                  properties:
                    dispatchDate: { type: string, format: date }
                    expectedArrival: { type: string, format: date }
                    vendorInvoiceNo: { type: string, maxLength: 60, nullable: true }
                    lrNo: { type: string, maxLength: 60, nullable: true }
                    vehicleNo: { type: string, maxLength: 30, nullable: true }
                    ewayBillNo: { type: string, maxLength: 30, nullable: true }
                    lines:
                      type: array
                      minItems: 1
                      maxItems: 300
                      items:
                        type: object
                        additionalProperties: false
                        required: [poLineId, qty]
                        properties:
                          poLineId: { type: integer, minimum: 1 }
                          qty: { type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.001 }
      responses:
        '201': { description: "ASN reference" }
        '400': { description: "Missing key, invalid input or domain validation failed" }
        '401': { $ref: '#/components/responses/PortalSession' }
        '403': { $ref: '#/components/responses/SupplierAccount' }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
        '409': { description: "Record is closed, version changed or request already processing" }
        '422': { description: "Key reused with a different request" }
  /api/v1/portal/supplier/orders/{id}/milestones/{milestoneId}:
    parameters:
      - { $ref: '#/components/parameters/SupplierRecordId' }
      - { name: milestoneId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      summary: Update a milestone on the approved expediting plan
      security: [{ PortalBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierIdempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, data]
              properties:
                version: { type: integer, minimum: 0 }
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    forecastDate: { type: string, format: date, nullable: true }
                    actualDate: { type: string, format: date, nullable: true }
                    remarks: { type: string, maxLength: 500, nullable: true }
      responses:
        '200': { description: "Milestone progress recorded" }
        '400': { description: "Missing key, invalid input or domain validation failed" }
        '401': { $ref: '#/components/responses/PortalSession' }
        '403': { $ref: '#/components/responses/SupplierAccount' }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
        '409': { description: "Record is closed, version changed or request already processing" }
        '422': { description: "Key reused with a different request" }
  /api/v1/portal/supplier/orders/{id}/payments/{paymentId}/advice:
    parameters:
      - { $ref: '#/components/parameters/SupplierRecordId' }
      - { name: paymentId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      summary: Download the payment advice for a settled payment on an invoice for this order
      security: [{ PortalBearer: [] }]
      responses:
        '200':
          description: Finance payment advice
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/PortalSession' }
        '403': { $ref: '#/components/responses/SupplierAccount' }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
  /api/v1/portal/supplier/uploads:
    post:
      summary: Stage a document in the current supplier grant for a malware scan
      security: [{ PortalBearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        '201': { description: Upload ID, name and scan status }
        '400': { description: Malformed multipart request }
        '422': { description: File rejected by the shared file policy }
        '401': { $ref: '#/components/responses/PortalSession' }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
        '413': { description: File exceeds the configured upload limit }
  /api/v1/portal/supplier/uploads/{id}:
    parameters: [{ $ref: '#/components/parameters/SupplierRecordId' }]
    get:
      summary: Check the scan status of an unconsumed upload
      security: [{ PortalBearer: [] }]
      responses:
        '200': { description: Upload ID, name and scan status }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
    delete:
      summary: Discard an unconsumed upload
      security: [{ PortalBearer: [] }]
      responses:
        '204': { description: Staged upload discarded }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
  /api/v1/portal/supplier/rfqs/{id}/files/{fileId}:
    parameters:
      - { $ref: '#/components/parameters/SupplierRecordId' }
      - { name: fileId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      summary: Download a scanned RFQ attachment shared by the buyer
      security: [{ PortalBearer: [] }]
      responses:
        '200':
          description: Attachment download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
  /api/v1/portal/supplier/orders/{id}/invoices:
    parameters:
      - { $ref: '#/components/parameters/SupplierRecordId' }
      - { $ref: '#/components/parameters/SupplierIdempotency' }
    post:
      summary: Submit an invoice and scanned PDF for the purchase order's normal approval chain
      description: Lines are matched against the PO and accepted GRNs. Duplicate invoice numbers for the supplier and fiscal year are rejected.
      security: [{ PortalBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId, data]
              additionalProperties: false
              properties:
                fileId: { type: integer, minimum: 1 }
                data: { $ref: '#/components/schemas/SupplierInvoice' }
      responses:
        '201': { description: Invoice reference, approval status and match result }
        '400': { description: Validation or match exception }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
        '409': { description: Duplicate invoice or upload still scanning }
        '422': { description: The uploaded invoice is not a PDF }
  /api/v1/portal/supplier/orders/{id}/vendor-documents/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/SupplierRecordId' }
      - { $ref: '#/components/parameters/SupplierIdempotency' }
      - { name: itemId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      summary: Submit a scanned file for a shared vendor document review requirement
      security: [{ PortalBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, fileId]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
                fileId: { type: integer, minimum: 1 }
      responses:
        '201': { description: Received requirement, version and current review code }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
        '409': { description: Requirement changed or upload still scanning }
  /api/v1/portal/supplier/compliance:
    get:
      summary: List company-wide supplier compliance documents and renewal types
      security: [{ PortalBearer: [] }]
      responses:
        '200': { description: Documents and verification status }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
    post:
      summary: Send a compliance renewal to the business partner verification worklist
      security: [{ PortalBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierIdempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docType, docNo, validFrom, validUntil, fileId]
              additionalProperties: false
              properties:
                docType: { type: string, maxLength: 40 }
                docNo: { type: string, maxLength: 120 }
                validFrom: { type: string, format: date }
                validUntil: { type: string, format: date }
                fileId: { type: integer, minimum: 1 }
      responses:
        '201': { description: Renewal reference awaiting verification }
        '400': { description: Document type or validity period is invalid }
        '404': { $ref: '#/components/responses/SupplierUnavailable' }
        '409': { description: Renewal already awaiting verification or upload still scanning }
  /api/v1/proc/rfqs/{id}/files/{fileId}/share:
    parameters:
      - { $ref: '#/components/parameters/SupplierRecordId' }
      - { $ref: '#/components/parameters/SupplierIdempotency' }
      - { name: fileId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      summary: Update supplier visibility for one scanned RFQ attachment as an authorised RFQ editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shared]
              additionalProperties: false
              properties: { shared: { type: boolean } }
      responses:
        '200': { description: Visibility updated and audited }
        '403': { description: RFQ edit permission required }
        '404': { description: File or RFQ unavailable }
components:
  parameters:
    SupplierRecordId: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    SupplierIdempotency: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
  responses:
    PortalSession: { description: "Current external portal session required" }
    SupplierAccount: { description: "Supplier account required" }
    SupplierUnavailable: { description: "Record outside the supplier grant or feature unavailable" }
  schemas:
    SupplierInvoice:
      type: object
      required: [invoiceNo, invoiceDate, declaredTotal, lines]
      additionalProperties: false
      properties:
        invoiceNo: { type: string, maxLength: 40 }
        invoiceDate: { type: string, format: date }
        vendorGstin: { type: string, nullable: true }
        declaredTotal: { type: number, minimum: 0 }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [poLineId, qty, rate, gstPct]
            additionalProperties: false
            properties:
              poLineId: { type: integer, minimum: 1 }
              description: { type: string, nullable: true }
              uom: { type: string, nullable: true }
              hsn: { type: string, nullable: true }
              qty: { type: number, minimum: 0, exclusiveMinimum: true }
              rate: { type: number, minimum: 0 }
              gstPct: { type: number, minimum: 0, maximum: 100 }
    SupplierQuoteLine:
      type: object
      additionalProperties: false
      required: [rfqLineId, rate]
      properties:
        rfqLineId: { type: integer, minimum: 1 }
        offeredQty: { type: number, minimum: 0, multipleOf: 0.001 }
        rate: { type: number, minimum: 0, multipleOf: 0.01 }
        discountPct: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        gstRate: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        freight: { type: number, minimum: 0, multipleOf: 0.01 }
        loading: { type: number, minimum: 0, multipleOf: 0.01 }
        otherCharges: { type: number, minimum: 0, multipleOf: 0.01 }
        make: { type: string, maxLength: 120, nullable: true }
        deviation: { type: string, maxLength: 500, nullable: true }
  securitySchemes:
    ErpBearer:
      type: http
      scheme: bearer
      description: Internal ERP IAM credential
    PortalBearer:
      type: http
      scheme: bearer
      description: Opaque session token returned by portal sign-in
    RegistrationReceipt:
      type: http
      scheme: bearer
      description: Private prospect receipt used to correct a returned vendor registration
