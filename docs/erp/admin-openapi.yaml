openapi: 3.0.3
info:
  title: ERP administration and data operations (module admin, parts 29.x)
  version: 1.0.0
  description: Every route needs the module flag of its part, the permission named in its summary and an Idempotency-Key on writes. Errors use the common envelope with a correlation ID.
servers: [{ url: /api/v1 }]
paths:
  # part 29.01 — the Enterprise Control Center (ff.admin.p2901)
  /admin/dashboard: { get: { summary: 'FR-02 governance metrics with their drill routes: approvals waiting (and mine), SoD violations, privileged access, dormant accounts, failed jobs and integrations, integrity failures, last backup, expiries, AI usage, unratified emergencies (adm.control.view)', responses: { '200': { description: '{ metrics, readOnly, myApprovals, environment }' } } } }
  /admin/catalogue: { get: { summary: 'FR-01 the settings pages the person may open (q searches label, keywords and route) and the recent configuration change requests', responses: { '200': { description: '{ pages, recent }' } } } }
  /admin/areas: { get: { summary: The current values of the changeable areas (feature flags, company parameters, Project 360 slots), responses: { '200': { description: '{ FEATURE_FLAG, PARAMETER, P360_LAYOUT }' } } } }
  /admin/changes:
    get: { summary: 'Admin change and ratification requests (status), with canDecide for the person', responses: { '200': { description: '{ rows, total, page, pageSize }' } } }
    post:
      summary: 'FR-03 BR-01 request a change (adm.change.create); applied only on approval: SYSADM → ITADM, financial keys → ITADM then CFO|DIR, security keys → ITADM then DIR'
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [area, key, value, reason], properties: { area: { type: string, enum: [FEATURE_FLAG, PARAMETER, P360_LAYOUT] }, key: { type: string }, value: {}, reason: { type: string, minLength: 5 } } } } } }
      responses: { '201': { description: The request }, '409': { description: Already a request for this key }, '422': { description: Same value or out of range } }
  /admin/changes/{id}/act: { post: { summary: 'Approve, return or reject at the current step (a comment for return or reject); the maker cannot decide; on the last approval the change is applied, or refused with 409 if the value changed since', responses: { '200': { description: The request }, '409': { description: Changed since raised } } } }
  /admin/changes/{id}/withdraw: { post: { summary: Withdraw one's own waiting request, responses: { '200': { description: The request } } } }
  /admin/emergency: { get: { summary: 'Read-only state and the emergency actions with their ratification', responses: { '200': { description: The state } } } }
  /admin/emergency/read-only: { post: { summary: 'FR-05 turn read-only mode on or off at once (adm.emergency.execute; reason); every write of the company then gets 423 until it is ended; raises a 24-hour ratification', responses: { '200': { description: The state } } } }
  /admin/emergency/kill: { post: { summary: 'FR-05 switch a feature flag off at once for the company (not the control center itself); ratification', responses: { '200': { description: The state } } } }
  /admin/emergency/force-logout: { post: { summary: 'FR-05 end every other session of the company; ratification', responses: { '200': { description: '{ ...state, sessionsEnded }' } } } }
  /admin/snapshots:
    get: { summary: The configuration snapshots, responses: { '200': { description: The list } } }
    post: { summary: Take a snapshot of the company's flags and parameters with its checksum (adm.snapshot.manage), responses: { '201': { description: The snapshot } } }
  /admin/snapshots/{id}/export: { get: { summary: 'The export file: format erp-config/1, environment, takenAt, checksum, content (audited)', responses: { '200': { description: JSON file } } } }
  /admin/snapshots/diff: { post: { summary: 'T-01 compare an export of another environment with this one: CHANGED, ONLY_HERE, ONLY_INCOMING with both values; a file whose checksum does not match is refused (422)', responses: { '200': { description: '{ from, to, differences }' } } } }
  /admin/snapshots/import: { post: { summary: 'Raise change requests for the chosen differences (keys area:key); nothing is applied until approved', responses: { '201': { description: The requests } } } }
  /admin/onboarding: { get: { summary: 'FR-04 the onboarding checklist of a company (adm.onboarding.run): settings, financial year, numbering, chart of accounts, users with roles, projects — each checked against its owner, with the page to complete it', responses: { '200': { description: '{ company, steps, done, total }' } } } }
  # part 29.02 — business connectors (ff.admin.p2902); every sync goes through the owning module's service (BR-01)
  /admin/connectors: { get: { summary: 'FR-07 the business connectors with their health (HEALTHY, DEGRADED, DOWN, UNKNOWN, NOT_ENABLED), breaker, last call, last run, and the bank accounts the person may sync (adm.connector.view)', responses: { '200': { description: '{ rows, canRun, canConfigure, canExport, bankAccounts }' } } } }
  /admin/connectors/mappings:
    get: { summary: 'Field mappings (connector, entity) with canApprove for the person', responses: { '200': { description: '{ rows }' } } }
    post:
      summary: 'Propose a mapping (adm.connector.configure); used only once the data owner approves it: gl_account, gst_rate, tds_section → ACCMGR; biometric_user → HRMGR; equipment → PLANTMGR'
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [connector, entity, internal, external, reason], properties: { connector: { type: string }, entity: { type: string, enum: [gl_account, gst_rate, tds_section, biometric_user, equipment] }, internal: { type: string }, external: { type: string }, reason: { type: string, minLength: 5 } } } } } }
      responses: { '201': { description: '{ id, requestId, status, approver }' }, '409': { description: The external value is already mapped or proposed } }
  /admin/connectors/mappings/requests/{id}/act: { post: { summary: 'Approve, return or reject a mapping request; the maker cannot decide; approval retires the mapping it replaces', responses: { '200': { description: The request } } } }
  /admin/connectors/runs: { get: { summary: 'FR-07 the sync runs (connector, status) with records, errors and the first problems', responses: { '200': { description: '{ rows, total, page, pageSize }' } } } }
  /admin/connectors/runs/export: { get: { summary: 'The runs report as xlsx, csv or pdf (audited)', responses: { '200': { description: File } } } }
  /admin/connectors/runs/{id}: { get: { summary: One run, responses: { '200': { description: The run } } } }
  /admin/connectors/runs/{id}/output: { get: { summary: 'The Tally XML of an accounting export run (adm.connector.export; audited)', responses: { '200': { description: application/xml } } } }
  /admin/connectors/accounting-export: { post: { summary: 'FR-02 approved journals of the period as Tally XML through the approved gl_account mappings (adm.connector.export and fin.journal.export); journals with an unmapped account are skipped and listed; detail carries the reconciliation (journals, exported, debit, credit, balanced)', responses: { '201': { description: The run } } } }
  /admin/connectors/{code}/health: { post: { summary: 'Test the connection through the hub (adm.connector.run)', responses: { '200': { description: '{ status, message, durationMs, checkedAt }' } } } }
  /admin/connectors/{code}/bank-statement: { post: { summary: 'FR-01 T-01 fetch the statement (bankAccountId, from, to) and import it through 23.06 (fin.bank_statement.import), which auto-matches and skips lines seen before; the bank is asked by account code, never the stored number', responses: { '201': { description: 'The run; detail { importId, lines, duplicates, matched, unmatched }' } } } }
  /admin/connectors/{code}/validate-account: { post: { summary: 'FR-01 penny-drop: valid account and the name at the bank compared with ours (score ≥ 60 passes)', responses: { '201': { description: 'The run; detail { valid, nameAtBank, nameScore }' } } } }
  /admin/connectors/{code}/biometric: { post: { summary: 'FR-03 T-01 pull punches since a time and store each through attendance (att.punch.device) under the approved device-user mapping; a punch already stored is replayed, not stored twice', responses: { '201': { description: 'The run; detail { pulled, stored, replayed, refusedByRules }' } } } }
  /admin/connectors/{code}/telematics: { post: { summary: 'FR-05 pull tracker readings and ingest them through 15.x telematics (plant.telematics.ingest) under the approved equipment mapping', responses: { '201': { description: The run } } } }
  # part 29.03 — API clients, webhooks, developer portal and usage (ff.admin.p2903). The public API itself is served at /api/public/{version}:
  # POST /api/public/v1/oauth/token (client credentials, JSON or form with Basic auth) and the catalogue routes listed by GET /admin/api/portal.
  /admin/api/clients:
    get: { summary: 'FR-02 the API clients with status, scopes, tier, environment, secret hint, 30-day calls and errors; the scopes, tiers and roles a client may take (adm.api.view)', responses: { '200': { description: '{ rows, canManage, scopes, tiers, roles }' } } }
    post:
      summary: 'Create a service account (adm.api.manage). The role must hold every permission of the scopes; SYSADM, ITADM and DIR are refused. Write scopes wait for DIR (section 9). The secret is returned once.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name, role, scopes, reason], properties: { name: { type: string }, role: { type: string }, scopes: { type: array, items: { type: string, enum: ['masters:read', 'procurement:read', 'procurement:write', 'site:read', 'attendance:write', 'plant:read', 'plant:write'] } }, projectIds: { type: array, items: { type: integer } }, tier: { type: string, enum: [BASIC, STANDARD, PREMIUM] }, environment: { type: string, enum: [SANDBOX, LIVE] }, ownerPartnerId: { type: integer }, reason: { type: string, minLength: 5 } } } } } }
      responses: { '201': { description: 'The client with clientSecret (once) and requestId when it waits for approval' }, '422': { description: The role lacks a scope's permission } }
  /admin/api/clients/requests/{id}/act: { post: { summary: 'Approve, return or reject a write client (DIR); the maker cannot decide', responses: { '200': { description: The request } } } }
  /admin/api/clients/{id}/rotate: { post: { summary: 'FR-02 key rotation: a new secret, returned once; the old one works for 24 hours', responses: { '200': { description: The client with clientSecret } } } }
  /admin/api/clients/{id}/revoke: { post: { summary: 'Revoke: every token ends at once and its webhooks are disabled', responses: { '200': { description: The client } } } }
  /admin/api/webhooks:
    get: { summary: 'FR-03 webhooks with delivered, waiting and given-up counts', responses: { '200': { description: '{ rows, canManage }' } } }
    post: { summary: 'Subscribe a client to events (exact types or module.*) within its scopes (403 otherwise); https and a public address in staging and production; the signing secret is returned once and stored encrypted', responses: { '201': { description: The webhook with signingSecret } } }
  /admin/api/webhooks/{id}/enable: { post: { summary: Enable, responses: { '200': { description: The webhook } } } }
  /admin/api/webhooks/{id}/disable: { post: { summary: Disable (nothing is queued or sent while disabled), responses: { '200': { description: The webhook } } } }
  /admin/api/webhooks/{id}/test: { post: { summary: 'Send admin.webhook.pinged at once, signed like every delivery', responses: { '200': { description: The delivery } } } }
  /admin/api/deliveries: { get: { summary: 'FR-03 the delivery log (webhookId, status) with attempts, response code, error, next try and replay link', responses: { '200': { description: '{ rows, total, page, pageSize }' } } } }
  /admin/api/deliveries/export: { get: { summary: The delivery log as xlsx, csv or pdf (audited), responses: { '200': { description: File } } } }
  /admin/api/deliveries/{id}: { get: { summary: One delivery with its payload, responses: { '200': { description: The delivery } } } }
  /admin/api/deliveries/{id}/replay: { post: { summary: 'FR-03 send the same event again as a new delivery (same x-delivery-id, so the receiver can de-duplicate)', responses: { '201': { description: The new delivery } } } }
  /admin/api/portal: { get: { summary: 'FR-04 the developer portal: base and token URLs, versions, deprecation policy, changelog, tiers, scopes with their events, the endpoint catalogue, subscribable events, the signature scheme and the sandbox clients (adm.api.portal)', responses: { '200': { description: The portal } } } }
  /admin/api/usage: { get: { summary: 'FR-05 calls, errors and throttles by client, day and endpoint, average duration, and webhook outcomes (days 1–90)', responses: { '200': { description: The report } } } }
  # part 29.04 — template packs and the bulk data entry workspace (ff.admin.p2904), on the Excel engine of 04.13
  /admin/bulk/packs: { get: { summary: 'FR-01 the packs by module (masters, workforce, project data, rates and SOR, business development) with their templates, version, whether each needs the module approver, and what the person may import (adm.bulk.use)', responses: { '200': { description: '{ rows, canManage }' } } } }
  /admin/bulk/packs/{code}: { get: { summary: 'A pack with its instructions, an example row per template and its version history', responses: { '200': { description: The pack } } } }
  /admin/bulk/packs/{code}/download: { get: { summary: 'FR-03 the pack as a zip: README (version, instructions, templates, history), an instructions workbook (every column, required, type, help, example) and each template the person may import (audited)', responses: { '200': { description: application/zip } } } }
  /admin/bulk/packs/{code}/versions: { post: { summary: 'FR-03 publish a new version of the pack documentation: instructions, examples by template, the templates it holds, notes (adm.pack.manage); the previous version is retired and kept', responses: { '201': { description: The pack } } } }
  /admin/bulk/templates/{code}: { get: { summary: 'The grid columns of a template: label, type, required, help and drop-down values; whether a batch needs approval and by whom (the template''s import permission)', responses: { '200': { description: The columns } } } }
  /admin/bulk/check: { post: { summary: 'FR-02 T-01 check rows without saving them, with the engine''s own row check; each result names the column and code of every error so the grid can highlight the cell', responses: { '200': { description: '{ results: [{ line, action, errors: [{ column, message, code }] }] }' } } } }
  /admin/bulk/batches:
    get: { summary: 'Batches: mine, for my approval (and those I decided) or all (adm.bulk.view_all); status filter', responses: { '200': { description: '{ rows, total, page, pageSize, awaiting, canViewAll }' } } }
    post: { summary: 'Save a draft batch (template, title, rows up to 2,000, onExisting); empty rows are dropped and the errors kept', responses: { '201': { description: 'The batch with results' } } }
  /admin/bulk/batches/{id}:
    get: { summary: 'A batch with its rows (sensitive columns masked for others), its row errors and its approval request', responses: { '200': { description: The batch } } }
    put: { summary: 'Change the preparer''s draft, returned or failed batch (version for optimistic locking)', responses: { '200': { description: The batch }, '409': { description: Locked or changed meanwhile } } }
  /admin/bulk/batches/{id}/submit: { post: { summary: 'BR-01 submit the whole batch once every row is correct (422 with the cells otherwise): approval-controlled data waits for the module approver (core_change_requests type xl_bulk_batch); data whose records have their own workflow is imported now', responses: { '200': { description: The batch } } } }
  /admin/bulk/batches/{id}/act: { post: { summary: 'The module approver approves (the batch is imported as its preparer, all or nothing: FAILED with the reason if anything fails), returns or rejects; the preparer never decides', responses: { '200': { description: The batch } } } }
  /admin/bulk/batches/{id}/cancel: { post: { summary: Cancel the preparer's draft, responses: { '200': { description: The batch } } } }
  # part 29.05 — the migration cockpit (ff.admin.p2905); page /admin/data-migration
  /admin/migration: { get: { summary: 'FR-01 the board: objects by phase and sequence with status, owner, trials passed on the current mapping, last run and whether the person must sign; the open cut-over; the kinds of object (adm.migration.view)', responses: { '200': { description: '{ rows, columns, cutover, canManage, canRun, kinds, totals }' } } } }
  /admin/migration/objects: { post: { summary: 'FR-01 plan an object (adm.migration.manage): code, name, kind (OPENING_TB, OPENING_STOCK or TEMPLATE:<import type>), phase (MASTERS, OPEN_DOCUMENTS, BALANCES), sequence, owner role; balances only in the balances phase', responses: { '201': { description: The object }, '409': { description: Already planned } } } }
  /admin/migration/objects/{code}: { get: { summary: 'An object with its mapping workbook and its last 20 loads with reconciliation', responses: { '200': { description: The object } } } }
  /admin/migration/objects/{code}/mapping: { put: { summary: 'FR-02 the mapping workbook: legacy column names, value maps per column (legacy code → new code), upper case, defaults, rows dropped when blank; a new version voids the trials and any sign-off', responses: { '200': { description: The object } } } }
  /admin/migration/objects/{code}/mapping/export: { get: { summary: The mapping workbook as Excel, responses: { '200': { description: xlsx } } } }
  /admin/migration/objects/{code}/runs: { post: { summary: 'FR-03 a TRIAL load (the real load through the owner''s service inside a savepoint, reconciled, then rolled back) or FR-04 the FINAL load (BR-01: two passed trials on the current mapping, the sign-off, the cut-over freeze and the earlier phases loaded; kept only if it reconciles, else rolled back). csv is the legacy extract with a header row; controls are the legacy figures (count, totalDebit, totalCredit, tb by account, stockValue, totalColumn and total); delta skips records that exist (adm.migration.load and the data''s own permission)', responses: { '201': { description: 'The run: status PASSED, FAILED, LOADED or ROLLED_BACK, reconciliation [{ check, legacy, migrated, ok }], problems by row' } } } }
  /admin/migration/objects/{code}/sign-off: { post: { summary: 'FR-05 ask for sign-off once two trials passed: the owner role, then the CFO for financial objects (core_change_requests type mig_object_signoff)', responses: { '200': { description: The object } } } }
  /admin/migration/objects/{code}/sign-off/act: { post: { summary: 'Sign off, return or reject at the current step; the maker never signs', responses: { '200': { description: The object } } } }
  /admin/migration/cutovers: { post: { summary: 'FR-04 plan the cut-over: name, freeze window, rollback point; the runbook steps are created', responses: { '201': { description: The cut-over } } } }
  /admin/migration/cutovers/{id}/status: { post: { summary: 'Start the freeze (FROZEN) or close the cut-over', responses: { '200': { description: The cut-over } } } }
  /admin/migration/cutovers/{id}/steps/{no}: { post: { summary: 'Tick or untick a runbook step with a note', responses: { '200': { description: The cut-over } } } }
  # part 29.06 — backup, restore and disaster recovery (ff.admin.p2906)
  /admin/backups/status: { get: { summary: 'FR-05 the health checks (full backup age, newest recovery point vs RPO, last backup failed, off-site copy, drill due) with open alerts, targets, retention, locations, the last drill and the production restore requests (adm.backup.view)', responses: { '200': { description: The status } } } }
  /admin/backups:
    get: { summary: 'FR-01 the backups (type, status) with size, rows, encryption, off-site copy, retention tiers and file replication', responses: { '200': { description: '{ rows, total, page, pageSize }' } } }
    post: { summary: 'Take a FULL or SNAPSHOT backup now (adm.backup.run): VACUUM INTO, checksums, integrity check, encrypted off-site copy verified by hash; a FULL also replicates stored files', responses: { '201': { description: The backup } } }
  /admin/backups/retention: { post: { summary: 'FR-02 apply the retention policy (daily, weekly, monthly, yearly fulls; 48 hours of snapshots); expired files are deleted, records kept', responses: { '200': { description: '{ kept, expired }' } } } }
  /admin/backups/monitor: { post: { summary: 'FR-05 run the checks now: raise an alert to ITADM for each failing check, resolve those that recovered', responses: { '200': { description: '{ raised, resolved }' } } } }
  /admin/backups/tests:
    get: { summary: 'Restore tests and DR drills (kind)', responses: { '200': { description: '{ rows, total, page, pageSize }' } } }
    post: { summary: 'FR-03 restore a backup (or the newest) into an isolated folder and validate it (off-site checksum, file checksum, integrity, row counts and table checksums, schema); a DRILL also measures restore time against the RTO and the data-loss window against the RPO (FR-04, T-01)', responses: { '201': { description: The test } } }
  /admin/backups/tests/{id}/report: { get: { summary: 'FR-04 the test or drill report as PDF or Excel (audited)', responses: { '200': { description: File } } } }
  /admin/backups/restores: { post: { summary: 'BR-01 request a production restore of a verified backup whose restore test passed, with the incident reference and summary (adm.backup.restore); one open request at a time', responses: { '201': { description: The request }, '409': { description: Another restore is open } } } }
  /admin/backups/restores/{id}/act: { post: { summary: 'Approve or reject: ITADM, then DIR; once approved the operator runs npm run db:restore -- --approved <id> with the application stopped (a safety copy of the current database is kept, the approval is used once)', responses: { '200': { description: The request } } } }
  # part 29.07 — retention, archival, legal holds, disposal and DPDP erasure (ff.admin.p2907)
  /admin/archive/policies:
    get: { summary: 'FR-01 the record classes (DPRs, journals, purchase orders, former employees) with their active policy (adm.archive.view)', responses: { '200': { description: '{ rows, classes, canManage, canDispose }' } } }
    post: { summary: 'Set a class''s policy (adm.archive.manage): archive after N months, keep N years, legal basis, then DISPOSE, ANONYMISE or REVIEW; the old policy is retired and kept', responses: { '201': { description: The policy } } }
  /admin/archive/jobs: { get: { summary: 'Archival jobs with their counts, approval and archive file', responses: { '200': { description: '{ rows }' } } }, post: { summary: 'FR-02 raise a job (SYSADM): the finished records past the archive age, or in closed projects, minus those on legal hold; approved by AUD, then archived', responses: { '201': { description: The job }, '422': { description: Nothing due } } } }
  /admin/archive/jobs/preview: { post: { summary: 'How many records a job would take and how many holds would skip', responses: { '200': { description: '{ total, held, eligible, cutoff }' } } } }
  /admin/archive/jobs/{id}/act: { post: { summary: 'AUD approves (the archive runs: snapshot with SHA-256 per record, a compressed file in archive storage, the rows become read-only), returns or rejects', responses: { '200': { description: The job } } } }
  /admin/archive/records: { get: { summary: 'FR-03 the archive, searchable by document number and class', responses: { '200': { description: '{ rows, total, page, pageSize }' } } } }
  /admin/archive/records/{id}: { get: { summary: 'An archived record: snapshot (personal fields masked without adm.archive.dispose), integrity against its hash, job, policy, holds and audit trail; the view is audited', responses: { '200': { description: The record } } } }
  /admin/archive/holds: { get: { summary: 'FR-04 active legal holds (all=1 for released too)', responses: { '200': { description: '{ rows, canHold }' } } }, post: { summary: 'Place a hold on a record of a class or on a project and all its records (adm.archive.hold)', responses: { '201': { description: The hold } } } }
  /admin/archive/holds/{id}/release: { post: { summary: Release a hold with a reason, responses: { '200': { description: The hold } } } }
  /admin/archive/disposals: { get: { summary: 'Disposals with counts and certificates', responses: { '200': { description: '{ rows }' } } }, post: { summary: 'FR-05 propose disposing the archived records past retention (AUD), held records left out; REVIEW policies refused', responses: { '201': { description: The proposal } } } }
  /admin/archive/disposals/{id}/act: { post: { summary: 'DIR approves: records deleted (anonymised where referenced or by policy), archive copies cleared, certificate of destruction issued', responses: { '200': { description: The disposal } } } }
  /admin/archive/disposals/{id}/certificate: { get: { summary: The certificate of destruction (PDF), responses: { '200': { description: application/pdf } } } }
  /admin/archive/erasures: { get: { summary: DPDP erasure requests with their checks, responses: { '200': { description: '{ rows }' } } }, post: { summary: 'Record a person''s erasure request (adm.archive.dispose): refused at once if a check fails (not employed, no legal hold, statutory retention elapsed), else sent to DIR', responses: { '201': { description: The request } } } }
  /admin/archive/erasures/check/{id}: { get: { summary: 'The checks for an employee', responses: { '200': { description: The checks } } } }
  /admin/archive/erasures/{id}/act: { post: { summary: 'DIR approves: the personal fields are redacted (code and payroll history kept) and audited', responses: { '200': { description: The request } } } }
  /admin/archive/report: { get: { summary: 'Live, archived, disposed and held counts by class', responses: { '200': { description: The report } } } }
  # part 29.08 — help desk, data corrections, knowledge base and in-app help (ff.admin.p2908); pages /help and /admin/support
  /admin/help/context: { get: { summary: 'FR-03 FR-04 the help of a page (route): its published articles, the tour for the person''s roles and whether it was seen, current announcements, the latest release; enabled false where the help desk is off or the person may not raise tickets (any signed-in user)', responses: { '200': { description: '{ enabled, route, articles, tour, tourSeen, announcements, release }' } } } }
  /admin/help/options: { get: { summary: 'Categories, priorities, teams and module owners', responses: { '200': { description: The options } } } }
  /admin/help/tours/{id}/seen: { post: { summary: Record that the person has seen a tour, responses: { '200': { description: ok } } } }
  /admin/help/releases: { get: { summary: 'FR-04 the release notes written by the release tool (docs/erp/releases), newest first', responses: { '200': { description: '{ rows }' } } } }
  /admin/help/tickets:
    get: { summary: 'Tickets: mine, the queue (hd.ticket.work or view_all; open by priority and SLA) or assigned to me; status, team and breached filters', responses: { '200': { description: '{ rows, total, page, pageSize, canWork }' } } }
    post: { summary: 'FR-01 T-01 raise a ticket (hd.ticket.raise): subject, description, category (routes the team), priority (sets the SLA), the page, record, correlation ID and failed call captured by the browser, the browser, update channels (EMAIL, WHATSAPP besides in-app)', responses: { '201': { description: The ticket } } }
  /admin/help/tickets/{id}: { get: { summary: 'A ticket with its timeline (internal notes only for support) and corrections; the correlation ID in full only for support', responses: { '200': { description: The ticket } } } }
